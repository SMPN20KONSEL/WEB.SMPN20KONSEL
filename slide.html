<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a4d">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Profil Sekolah | SMP Negeri 20 Konawe Selatan</title>
<style>
:root{--navy:#061a45;--blue:#1769e8;--cyan:#38d6f0;--gold:#f4c95d;--white:#f7faff;--muted:#b9c8e8;--serif:Georgia,"Times New Roman",serif;--sans:"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);background:#041030;color:var(--white);overflow:hidden}
body{background:radial-gradient(ellipse at 12% 10%,#133f8a 0,transparent 45%),radial-gradient(ellipse at 90% 90%,#0d3a73 0,transparent 42%),#041030}
button{font:inherit;color:inherit}
.app{height:100dvh;display:flex;flex-direction:column;padding:0;gap:0}
.top{display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:14px;padding:4px;flex-shrink:0}
.brand{flex:1;min-width:0}
.brand small{display:block;color:var(--cyan);font-size:clamp(10px,1vw,13px);letter-spacing:.08em}
.brand b{display:block;font-family:var(--serif);font-size:clamp(17px,2vw,28px);line-height:1.15}
.clock{text-align:right}
.clock .t{font-size:clamp(18px,2.2vw,32px);font-weight:700;font-variant-numeric:tabular-nums}
.clock .d{font-size:clamp(10px,1vw,13px);color:var(--muted)}
.stage{position:relative;flex:1;min-height:0;border:0;border-radius:0;overflow:hidden;background:linear-gradient(125deg,#0b2761f0,#061841f2)}
.bar{position:absolute;top:0;left:0;right:0;height:4px;background:#ffffff18;z-index:6}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .5s linear}
.dots{position:absolute;top:16px;right:20px;display:flex;gap:6px;z-index:6}
.dots span{width:7px;height:7px;border-radius:9px;background:#ffffff4d;cursor:pointer;transition:.3s}
.dots span.on{width:24px;background:var(--gold)}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(18px,4vw,56px);align-items:center;padding:clamp(18px,3.2vw,52px) clamp(22px,4vw,60px) 96px;opacity:0;visibility:hidden;transform:translateX(26px);transition:opacity .7s ease,transform .7s ease,visibility .7s}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.solo{grid-template-columns:1fr}
.kick{display:inline-block;color:var(--gold);font-weight:700;font-size:clamp(12px,1.1vw,16px);padding-left:34px;position:relative}
.kick:before{content:"";position:absolute;left:0;top:50%;width:24px;height:3px;border-radius:3px;background:var(--gold)}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(26px,min(4.4vw,7.4vh),64px);line-height:1.06;letter-spacing:-.02em;margin:16px 0 16px}
h2 em{font-style:normal;color:var(--gold)}
.lead{font-size:clamp(13px,min(1.45vw,2.5vh),21px);line-height:1.6;color:#d6e2fb;max-width:760px;margin:0}
.quote{border-left:4px solid var(--gold);padding:4px 0 4px 18px;margin:18px 0 0;font-family:var(--serif);font-size:clamp(14px,1.4vw,20px);line-height:1.6;color:#e8efff;max-width:780px}
.sign{margin-top:14px;color:var(--gold);font-weight:700;font-size:clamp(13px,1.2vw,18px)}
.sign small{display:block;color:var(--muted);font-weight:400}
.vis{position:relative;width:100%;height:min(52vh,470px);min-height:200px;border-radius:20px;overflow:hidden;border:1px solid #ffffff30;background:linear-gradient(145deg,#16418a,#0a1a40);box-shadow:0 18px 40px #0006}
.vis.portrait{width:auto;aspect-ratio:3/4;height:min(60vh,520px);max-width:100%;justify-self:center}.vis.portrait img{object-fit:cover;object-position:50% 0}.slide.on .vis.portrait img.on{animation:none}
.vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:0;transition:opacity 1.2s ease}
.vis img.on{opacity:1}
.slide.on .vis img.on{animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.vis:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#041030b0);pointer-events:none}
.vis .fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(70px,12vw,140px)}
.vis.nofoto .fb{display:flex}
.grid{display:grid;gap:12px;margin-top:22px;max-width:840px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{padding:14px 18px;border:1px solid #ffffff24;background:#ffffff0d;border-radius:14px;min-width:0}
.card .ic{font-size:clamp(22px,2.4vw,32px)}
.card h3{margin:6px 0 4px;font-size:clamp(14px,1.3vw,19px)}
.card p{margin:0;font-size:clamp(11px,1vw,15px);line-height:1.5;color:#cddaf5}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px;max-width:700px}
.stat{padding:14px 16px;border:1px solid #ffffff24;background:#ffffff0b;border-radius:14px}
.stat b{display:block;font-family:var(--serif);font-size:clamp(24px,3.2vw,44px);color:var(--gold);line-height:1}
.stat span{display:block;margin-top:6px;font-size:clamp(11px,1vw,14px);color:var(--muted)}
table{border-collapse:collapse;margin-top:18px;width:100%;max-width:640px;font-size:clamp(12px,1.2vw,18px)}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid #ffffff22}
th{color:var(--gold);font-weight:700}
td:nth-child(2){font-family:var(--serif);font-size:1.25em;color:var(--gold)}
.kv{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.7fr);gap:4px 16px;padding:8px 0;border-bottom:1px solid #ffffff22;font-size:clamp(12px,1.15vw,17px)}
.kv span{color:var(--muted)}.kv b{color:#fff;font-weight:600}
.list{margin-top:16px;max-width:760px}
.ol{margin:12px 0 0;padding-left:22px;font-size:clamp(12px,1.15vw,17px);line-height:1.5;color:#d6e2fb;max-width:780px}
.ol li{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px;max-width:800px}
.chip{padding:8px 15px;border-radius:30px;border:1px solid #ffffff30;background:#ffffff10;font-size:clamp(12px,1.1vw,16px)}
.chip.hot{background:var(--gold);color:#241a00;border-color:var(--gold);font-weight:700}
.chip.ok{border-color:#4ade80aa}.chip.mid{border-color:var(--gold)}.chip.bad{border-color:#f87171;background:#f8717122}
.center{text-align:center;max-width:1000px;margin:auto}
.center .lead{margin:auto}
.mos{display:grid;gap:10px;width:100%;height:min(54vh,480px);min-height:220px}
.mos .tile{position:relative;border-radius:16px;overflow:hidden;border:1px solid #ffffff30;background:linear-gradient(145deg,#16418a,#0a1a40);box-shadow:0 12px 28px #0006}
.mos .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:0;transition:opacity 1s ease}
.mos.m1{grid-template-columns:1fr}
.mos .tile img.on{opacity:1}
.slide.on .mos .tile img.on{animation:kb 16s ease-out forwards}
.mos.m2{grid-template-columns:1fr 1fr}
.mos.m3{grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr}
.mos.m3 .tile:nth-child(1){grid-row:1/3}
.mos.m4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mos.m5{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.mos.m5 .tile:nth-child(1){grid-column:1/3;grid-row:1/3}
.mos.m5 .tile:nth-child(2){grid-column:3;grid-row:1}
.mos.m5 .tile:nth-child(3){grid-column:3;grid-row:2}
.mos.m5 .tile:nth-child(4){grid-column:1;grid-row:3}
.mos.m5 .tile:nth-child(5){grid-column:2/4;grid-row:3}
.paused .vis img,.paused .tile img{animation-play-state:paused!important}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;margin:16px auto 0;width:100%;max-width:1000px;height:min(52vh,440px)}
.cell{position:relative;border-radius:14px;overflow:hidden;border:1px solid #ffffff30;background:linear-gradient(145deg,#16418a,#0a1a40)}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
.cell img.on{opacity:1}
.vframe{position:relative;overflow:hidden;background:#000}
.slide.vid{display:block;padding:0}
.slide.vid .vframe{position:absolute;inset:0;width:100%;height:100%}
.vtitle{position:absolute;left:0;right:0;top:0;z-index:3;padding:20px clamp(18px,3vw,40px) 48px;background:linear-gradient(#000c,transparent);pointer-events:none;animation:vt 1s 8s forwards}
.vtitle h3{margin:6px 0 0;font-family:var(--serif);font-size:clamp(18px,2.4vw,34px);line-height:1.15;color:#fff}
@keyframes vt{to{opacity:0}}
.vfall{position:absolute;inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:24px;background:#000d;color:#fff}
.vfall a{color:var(--gold);font-weight:700}
.dots.hide{display:none}
.vframe video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.vframe iframe,.vframe #ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
.vframe.short{container-type:size}
.vframe.short iframe,.vframe.short #ytp{inset:0;margin:0 auto;height:100%;width:min(100cqw,calc(100cqh * 9 / 16))}

/* ===== SLIDE PEMBUKA (gaya video referensi) ===== */
.slide.open{display:block;padding:0;transform:scale(1.05)}
.slide.open.on{transform:none}
.vis.opbg{position:absolute;inset:0;width:100%;height:auto;max-width:none;min-height:0;border:0;border-radius:0;box-shadow:none}
.vis.opbg:after{inset:0;background:linear-gradient(#ffffff2e,#0a2a4a33)}
.vis.opbg .fb{display:none!important}
.opbox{position:absolute;inset:0;container-type:size}
.opsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.opsvg .sh,.opsvg .dia,.opsvg .dia2{transform-box:fill-box;transform-origin:center}
.slide.on .opsvg .sh.a{animation:inL 1.4s .2s cubic-bezier(.2,.8,.2,1) both}
.slide.on .opsvg .sh.b{animation:inR 1.4s .2s cubic-bezier(.2,.8,.2,1) both}
.slide.on .opsvg .dia,.slide.on .opsvg .dia2{animation:pop 1.3s .05s cubic-bezier(.2,.8,.2,1) both}
@keyframes inL{from{opacity:0;transform:translateX(-90px)}}
@keyframes inR{from{opacity:0;transform:translateX(90px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.ln{position:absolute;height:1.3cqh;border-radius:9px}
.ln.l{transform-origin:left}.ln.r{transform-origin:right}
.slide.on .ln{animation:grow .9s 1.2s ease-out both}
@keyframes grow{from{transform:scaleX(0);opacity:0}}
.optx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4cqh 14cqw;font-family:"Arial Black","Segoe UI Black",Impact,var(--sans);font-weight:900;text-transform:uppercase;line-height:1.05;text-shadow:0 .4cqh 1cqh #0005}
.optx>*{animation:none}
.slide.on .optx>*{animation:up .9s ease-out both}
.slide.on .optx>:nth-child(1){animation-delay:.5s}.slide.on .optx>:nth-child(2){animation-delay:.8s}
.slide.on .optx>:nth-child(3){animation-delay:1.1s}.slide.on .optx>:nth-child(4){animation-delay:1.4s}
.slide.on .optx>:nth-child(5){animation-delay:1.6s}.slide.on .optx>:nth-child(6){animation-delay:1.8s}
@keyframes up{from{opacity:0;transform:translateY(2.5cqh)}}
.oplogo{height:15cqh;width:auto;margin-bottom:1cqh;filter:drop-shadow(0 .5cqh 1cqh #0006)}
.t1{font-size:min(11.5cqw,20cqh);color:#fff;letter-spacing:.01em}
.t2{font-size:min(7cqw,12.5cqh);color:#ffee1a;margin-top:.5cqh}
.tmid{position:relative;width:100cqw;margin:0 -14cqw;display:flex;flex-direction:column;align-items:center}
.t3{font-size:min(3.3cqw,5.8cqh);letter-spacing:.04em;color:#fff;margin-top:1cqh}
.t4{font-size:min(3.8cqw,6.6cqh);color:#fff;margin-top:.6cqh}
.t5{font-size:min(5cqw,9cqh);color:#ffee1a;margin-top:1.4cqh}
.t5 small{display:block;font-size:.42em;color:#fff;letter-spacing:.12em}

.slide.galslide{grid-template-columns:1fr;align-items:stretch;padding:clamp(14px,2.2vw,30px) clamp(16px,2.6vw,40px) 78px}
.galslide .txt{display:flex;flex-direction:column;height:100%;min-height:0}
.galslide .center{display:flex;flex-direction:column;height:100%;width:100%;max-width:none;margin:0;text-align:left}
.galslide h2{font-size:clamp(20px,min(3vw,5vh),42px);margin:4px 0 10px}
.galslide .gal{flex:1;min-height:0;height:auto;max-width:none;margin:0;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:14px clamp(18px,4vw,56px) 18px;background:linear-gradient(transparent,#030c26f2 60%);text-align:center;font-size:clamp(13px,min(1.25vw,2.3vh),18px);line-height:1.45;min-height:64px;color:#fff;text-shadow:0 1px 6px #000a}
.cap:empty{display:none}
.bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.ctl{display:flex;align-items:center;gap:7px}
.b{min-width:42px;height:42px;padding:0 12px;border:1px solid #ffffff30;background:#ffffff12;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.b:hover{background:var(--blue)}
.b:focus-visible,.dots span:focus-visible,.start:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.b.main{background:var(--gold);color:#241a00;border-color:var(--gold);font-weight:700}
.b.musoff{opacity:.7}
.note{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:12;max-width:86%;width:auto;font-size:12px;color:#e6eeff;text-align:center;background:#000a;padding:6px 14px;border-radius:10px}
.note:empty{display:none}
.hud{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .35s}
.stage.hud-on .hud{opacity:1}
.stage.hud-on .hud button{pointer-events:auto}
.stage:not(.hud-on){cursor:none}
.hotzone{display:none;position:absolute;top:0;left:0;right:0;height:80px;z-index:7}
.stage.isvid .hotzone{display:block}
.cbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:1px solid #ffffff55;background:#ffffff1f;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:36px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .2s}
.cbtn:hover{background:#ffffff38}
.cbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:70px;font-size:26px;background:#ffffff14;border-color:#ffffff22}
.nav.l{left:14px}.nav.r{right:14px}
.tools{position:absolute;right:14px;bottom:68px;display:flex;gap:8px}
.tools .b{background:#00000055;font-size:18px}
.cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#14459a 0,#061a45 55%,#030b24);transition:opacity .8s,visibility .8s}
.cover.gone{opacity:0;visibility:hidden}
.cover .cbg{position:absolute;inset:0;overflow:hidden;z-index:0}
/* Titik fokus = kerumunan siswa (±42,8% dari lebar foto) diletakkan tepat di tengah layar, kiri-kanan seimbang */
.cover .cbg img{position:absolute;top:0;left:50%;height:100%;width:auto;min-width:118vw;object-fit:cover;object-position:50% 45%;margin:0;padding:0;border-radius:0;background:none;transform:translateX(-42.8%);transform-origin:42.8% 62%;animation:kbc 18s ease-out forwards}
@keyframes kbc{from{transform:translateX(-42.8%) scale(1)}to{transform:translateX(-42.8%) scale(1.07)}}
.cover .cbg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#04103055 0%,#04103080 40%,#041030cc 100%),radial-gradient(ellipse at 50% 55%,#04103099 0,transparent 70%)}
.cover>div{position:relative;z-index:2;max-width:100%}
.cover h1,.cover p{text-shadow:0 2px 14px #000c}
.cover p{color:#e6eeff}
.cover img{width:clamp(90px,14vw,150px);background:#fff;border-radius:26px;padding:10px;margin-bottom:22px}
.cover h1{font-family:var(--serif);font-size:clamp(30px,6vw,72px);line-height:1.05;margin:0 0 12px}
.cover p{color:var(--muted);max-width:560px;margin:0 auto 28px;line-height:1.6;font-size:clamp(14px,1.5vw,19px)}
.start{padding:16px 38px;border-radius:40px;border:0;background:var(--gold);color:#241a00;font-weight:800;font-size:clamp(16px,1.7vw,22px);cursor:pointer;box-shadow:0 10px 30px #f4c95d44}
.start:hover{transform:translateY(-2px)}
.start:disabled{opacity:.75;cursor:wait;transform:none}
@media(max-width:820px){
 .clock{display:none}
 .slide{grid-template-columns:1fr;align-content:center;gap:14px;padding:22px 18px 100px;overflow-y:auto}
 .slide.open{padding:0;overflow:hidden}
 .slide .vis{grid-row:1;height:24vh;min-height:130px}
 .slide.open .vis.opbg{height:auto;min-height:0}
 .slide .mos{grid-row:1;height:28vh;min-height:150px}
 .slide .vis.portrait{height:30vh;max-width:none}
 .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stats{gap:7px}.stat{padding:10px}
 .grid{margin-top:14px}
 h2{margin:10px 0}
 .ln{display:none}
 .cap{font-size:13px;min-height:56px}
 .slide.solo .vis{display:none}
 .gal{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));height:46vh}
 .slide.galslide{padding:14px 12px 90px}
 .galslide .gal{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div style="position:fixed;left:-9999px;top:0;width:240px;height:135px;pointer-events:none" aria-hidden="true"><div id="mplayer"></div></div>

<div class="cover" id="cover">
  <div class="cbg"><img src="image/upacara.jpg" alt="" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='https://smpn20konsel.github.io/WEB.SMPN20KONSEL/image/upacara.jpg'}else{this.remove()}"></div>
  <div>
    <img src="image/Logo_transparent.png" alt="Logo SMP Negeri 20 Konawe Selatan" onerror="this.style.display='none'">
    <h1>SMP Negeri 20<br>Konawe Selatan</h1>
    <p>Profil sekolah tahun pelajaran 2026/2027 lengkap dengan penjelasan suara. Musik latar akan menyala otomatis. Aktifkan suara perangkat Anda, lalu tekan tombol di bawah.</p>
    <button class="start" id="start">▶ Mulai</button>
  </div>
</div>

<div class="app">
  <main class="stage hud-on" id="stage" aria-live="polite">
    <div class="bar"><i id="prog"></i></div>
    <div class="dots" id="dots"></div>
    <div id="slides"></div>
    <div class="cap" id="cap"></div>
    <div class="hotzone" id="hot"></div>
    <div class="hud">
      <button class="b nav l" id="prev" title="Slide sebelumnya (←)" aria-label="Sebelumnya">‹</button>
      <button class="cbtn" id="play" title="Jeda / lanjut (Spasi)" aria-label="Jeda atau lanjut">Ⅱ</button>
      <button class="b nav r" id="next" title="Slide berikutnya (→)" aria-label="Berikutnya">›</button>
      <div class="tools">
        <button class="b" id="vc" title="Ganti suara narasi" aria-label="Ganti suara">🗣</button>
        <button class="b" id="full" title="Layar penuh (F)" aria-label="Layar penuh">⛶</button>
      </div>
    </div>
    <div class="note" id="note"></div>
  </main>
</div>

<script>
(() => {
'use strict';
const SITE = 'https://smpn20konsel.github.io/WEB.SMPN20KONSEL/';
const $ = id => document.getElementById(id);
const wrap = $('slides'), dotsEl = $('dots'), cap = $('cap'), prog = $('prog'), note = $('note');
const pathEnc = p => encodeURI(p);

let galPool = [];
function probe(path){
  return new Promise(res => {
    const im = new Image(); let tried = false;
    im.onload = () => res(im.src);
    im.onerror = () => { if(!tried){ tried = true; im.src = SITE + pathEnc(path); } else res(null); };
    im.src = pathEnc(path);
  });
}
async function initGalleryPool(){
  const names = GAL_NAMES.slice();
  for(let i = names.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [names[i], names[j]] = [names[j], names[i]]; }
  const found = (await Promise.all(names.slice(0, 60).map(n => probe('Galeri/' + n)))).filter(Boolean);
  galPool = found.slice(0, 30);
  if(galPool.length < 12){
    const extra = (await Promise.all(BASE_IMGS.map(probe))).filter(Boolean);
    galPool = galPool.concat(extra);
  }
}

/* ===== VIDEO ===== */
function ytId(link){
  if(!link) return '';
  try{
    const u = new URL(link);
    if(u.pathname.startsWith('/shorts/')) return u.pathname.split('/shorts/')[1].split('/')[0];
    if(u.searchParams.has('v')) return u.searchParams.get('v');
    if(u.hostname === 'youtu.be') return u.pathname.replace('/', '').split('/')[0];
    if(u.pathname.startsWith('/embed/')) return u.pathname.split('/embed/')[1].split('/')[0];
  }catch(e){}
  return '';
}

async function loadFirebaseVideos(){
  try{
    const m = await import('./assets/js/firebase.js');
    const fs = await import('https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js');
    const q = fs.query(fs.collection(m.db, 'video_sekolah'), fs.orderBy('createdAt', 'desc'));
    const snap = await fs.getDocs(q);
    const out = [];
    snap.forEach(d => {
      const x = d.data(), id = ytId(x.link);
      if(id) out.push({ video:{t:'yt', id}, judul: x.judul || 'Video Kegiatan Sekolah', desk: x.deskripsi || '' });
    });
    return out;
  }catch(e){ return []; }
}

/* ===== RENDER ===== */
window.__fb = function(img){
  if(!img.dataset.t){ img.dataset.t = 1; img.src = SITE + img.dataset.p; return; }
  const tile = img.closest('.tile');
  if(tile){ const m = tile.parentElement; tile.remove(); const n = m.children.length; if(n) m.className = 'mos m' + n; else m.remove(); return; }
  const v = img.closest('.vis');
  img.remove();
  if(v && !v.querySelector('img')) v.classList.add('nofoto');
};
window.__ld = function(img){
  const v = img.closest('.vis');
  if(v){ v.classList.remove('nofoto'); if(!v.querySelector('img.on')) img.classList.add('on'); }
};
const imgTag = p => `<img alt="" loading="eager" src="${pathEnc(p)}" data-p="${pathEnc(p)}" onload="__ld(this)" onerror="__fb(this)">`;

function build(){
  wrap.innerHTML = ''; dotsEl.innerHTML = '';
  slides.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide' + (s.gallery ? ' galslide' : '') + (s.kind === 'solo' ? ' solo' : '') + (s.kind === 'open' ? ' open' : '') + (s.video ? ' vid' : '');
    let vis = '';
    if (s.kind === 'open') {
      vis = `<div class="vis opbg">${(s.imgs || []).map(imgTag).join('')}<div class="fb"></div></div>`;
      el.innerHTML = vis + s.html;
    } else if (s.video) {
      el.innerHTML = `<div class="vframe${s.video.short ? ' short' : ''}"></div><div class="vtitle"><span class="kick">${s.kicker}</span><h3>${esc(s.title)}</h3></div>`;
    } else {
      if (s.kind !== 'solo' && s.collage) {
        const n = Math.min(5, s.collage.length);
        vis = `<div class="mos m${n}">` + s.collage.slice(0, n).map(p => `<div class="tile"><img alt="" src="${pathEnc(p)}" data-p="${pathEnc(p)}" onload="this.classList.add('on')" onerror="__fb(this)"></div>`).join('') + '</div>';
      } else if (s.kind !== 'solo') {
        vis = `<div class="vis ${s.portrait ? 'portrait' : ''}">${(s.imgs || []).map(imgTag).join('')}<div class="fb">${s.emoji || '🏫'}</div></div>`;
      }
      el.innerHTML = `<div class="txt">${s.html}</div>${vis}`;
    }
    wrap.appendChild(el);
    s.el = el;
    const d = document.createElement('span');
    d.tabIndex = 0; d.setAttribute('role', 'button'); d.setAttribute('aria-label', 'Slide ' + (i + 1));
    d.onclick = () => go(i); d.onkeydown = e => { if (e.key === 'Enter') go(i); };
    dotsEl.appendChild(d);
  });
  dots = [...dotsEl.children];
}

let rotTimer = null;
function startRotate(el){
  clearInterval(rotTimer);
  const imgs = [...el.querySelectorAll('.vis img')];
  imgs.forEach(i => i.classList.remove('on'));
  if(!imgs.length) return;
  let k = 0;
  const show = () => {
    const good = [...el.querySelectorAll('.vis img')].filter(i => i.complete && i.naturalWidth > 0);
    if(!good.length) return;
    if(good.length < 2 && good[0].classList.contains('on')) return;
    good.forEach(i => i.classList.remove('on'));
    const g = good[k % good.length]; g.classList.add('on');
    g.style.animation = 'none'; void g.offsetWidth; g.style.animation = '';
    k++;
  };
  show();
  rotTimer = setInterval(() => { if(!document.body.classList.contains('paused')) show(); }, 5000);
}

function fit(el){
  const t = el.querySelector('.txt'); if(!t) return;
  t.style.zoom = 1;
  if(window.matchMedia('(max-width:820px)').matches) return;
  const cs = getComputedStyle(el);
  const avail = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let z = 1;
  for(let n = 0; n < 4; n++){
    const h = t.getBoundingClientRect().height;
    if(h <= avail + 1 || z <= .4) break;
    z = Math.max(.4, z * avail / h * .98);
    t.style.zoom = z;
  }
}
const fitAll = () => slides.forEach(s => fit(s.el));
window.addEventListener('resize', fitAll);
window.addEventListener('load', fitAll);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

/* ===== NARASI SUARA ===== */
const synth = window.speechSynthesis;
let voice = null;
let voices = [], vi = 0;
function pickVoice(){
  if(!synth) return;
  const all = synth.getVoices();
  const sc = v => (/natural/i.test(v.name) ? 100 : 0) + (/online/i.test(v.name) ? 20 : 0) + (/google/i.test(v.name) ? 40 : 0) + (/gadis|damayanti|female|wanita/i.test(v.name) ? 10 : 0) + (/^id[-_]ID/i.test(v.lang) ? 5 : 0);
  voices = all.filter(v => /^id([-_]|$)/i.test(v.lang) || /indonesia/i.test(v.name)).sort((a, b) => sc(b) - sc(a));
  voice = voices[vi % Math.max(1, voices.length)] || null;
  if(!note.dataset.m) note.textContent = (!voice && all.length) ? 'Suara bahasa Indonesia belum terpasang di perangkat ini. Pasang paket suara Indonesia di pengaturan perangkat agar narasi terdengar jelas.' : '';
}
const sp = t => t.replace(/\bSMPN\b/g, 'S M P N').replace(/\bPPPK\b/g, 'P P P K').replace(/\bASN\b/g, 'A S N').replace(/\bNPSN\b/g, 'N P S N');
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }

/* ===== MUSIK LATAR (YouTube, otomatis menyala saat Mulai) ===== */
const MUSIC_ID = 'wBd0mbOAHXY';
const Music = (() => {
  let mp = null, ready = false, started = false, enabled = false, susp = false, ducked = 1, tries = 0;
  const BASE = 40;
  function apply(){
    if(!mp || !ready) return;
    try{
      mp.setVolume(enabled ? Math.round(BASE * ducked) : 0);
      if(enabled && !susp) mp.playVideo(); else mp.pauseVideo();
    }catch(e){}
  }
  return {
    start(){
      if(started){ apply(); return; }
      started = true; enabled = true;
      loadYT().then(ok => {
        if(!ok) return;
        const pv = { loop: 1, playlist: MUSIC_ID, controls: 0, playsinline: 1, rel: 0, autoplay: 1 };
        if(/^https?:/.test(location.protocol)) pv.origin = location.origin;
        try{
          mp = new YT.Player('mplayer', { videoId: MUSIC_ID, width: '240', height: '135', playerVars: pv,
            events: {
              onReady: () => { ready = true; apply(); },
              onStateChange: e => {
                if(e.data === 0){ try{ mp.playVideo(); }catch(x){} }
                else if((e.data === 5 || e.data === -1 || e.data === 2) && enabled && !susp && tries < 6){ tries++; setTimeout(apply, 800); }
              },
              onError: () => {}
            } });
        }catch(e){}
      });
    },
    setEnabled(b){ enabled = b; apply(); },
    duck(on, lvl){ ducked = on ? (lvl === undefined ? .4 : lvl) : 1; apply(); },
    suspend(x){ susp = x; apply(); }
  };
})();

/* ===== VIDEO & KONTROLER ===== */
let idx = 0, playing = false, narOn = !!synth, tok = 0, sentIdx = 0, advTimer = null, musOn = false;
let yt = null, ytReady = false, ytPending = false, ytApi = null, vel = null, vFail = false, videoPhase = false, galTimer = null;

function loadYT(){
  if(ytApi) return ytApi;
  ytApi = new Promise(res => {
    if(window.YT && YT.Player) return res(true);
    window.onYouTubeIframeAPIReady = () => res(true);
    const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.onerror = () => res(false);
    document.head.appendChild(sc);
    setTimeout(() => res(!!(window.YT && YT.Player)), 8000);
  });
  return ytApi;
}
function disposeVideo(){
  if(yt){ try{ yt.stopVideo(); yt.destroy(); }catch(e){} yt = null; }
  if(vel){ try{ vel.pause(); vel.removeAttribute('src'); vel.load(); }catch(e){} vel = null; }
  ytReady = false; ytPending = false; vFail = false;
}
async function prepareVideo(s, slideI){
  const box = s.el.querySelector('.vframe');
  disposeVideo();
  delete box.dataset.alt;
  const v = s.video; v.unm = 0;
  if(v.t === 'mp4'){
    box.innerHTML = '';
    const el = document.createElement('video');
    el.controls = true; el.playsInline = true; el.preload = 'auto';
    let tried = false;
    const toYT = () => {
      if(v.t !== 'mp4' || slideI !== idx) return;
      if(v.id){ v.t = 'yt'; prepareVideo(s, slideI); }
      else { vFail = true; if(videoPhase) endVideo(); }
    };
    el.addEventListener('ended', () => { if(videoPhase) endVideo(); });
    el.addEventListener('error', () => {
      if(v.t !== 'mp4') return;
      if(!tried){ tried = true; el.src = SITE + pathEnc(v.src); el.load(); }
      else toYT();
    });
    el.src = pathEnc(v.src);
    box.appendChild(el); vel = el;
    /* pengaman: kalau mp4 tidak memuat data dalam 6 detik, pindah ke YouTube */
    setTimeout(() => { if(vel === el && el.readyState < 2) toYT(); }, 6000);
    return;
  }
  box.innerHTML = '<div id="ytp"></div>';
  const ok = await loadYT();
  if(slideI !== idx) return;
  if(!ok){
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/${v.id}?rel=0&autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="Video"></iframe>`;
    return;
  }
  const pv = { rel: 0, modestbranding: 1, playsinline: 1 };
  if(v.auto){ pv.autoplay = 1; pv.mute = 1; }
  if(/^https?:/.test(location.protocol)) pv.origin = location.origin;
  const opt = { videoId: v.id, width: '100%', height: '100%', playerVars: pv };
  if(v.short) opt.host = 'https://www.youtube-nocookie.com';
  yt = new YT.Player('ytp', Object.assign(opt, {
    events: {
      onReady: () => { ytReady = true; if(v.auto){ try{ yt.mute(); yt.playVideo(); }catch(x){} } if(ytPending){ ytPending = false; ytStart(); } },
      onStateChange: e => {
        if(e.data === 1 && v.auto && !v.unm){ v.unm = 1; try{ yt.unMute(); yt.setVolume(100); }catch(x){} }
        if(e.data === 0 && videoPhase) endVideo();
      },
      onError: e => {
        const c = e && e.data;
        /* 100/101/150 = video tidak tersedia / embed dilarang; 153 = origin/referrer hilang (biasanya file://) */
        if(c !== 100 && c !== 101 && c !== 150 && c !== 153 && !box.dataset.alt){
          box.dataset.alt = 1;
          try{ yt.destroy(); }catch(x){}
          yt = null; ytReady = false; ytPending = false;
          box.innerHTML = `<iframe src="https://www.youtube.com/embed/${v.id}?rel=0&playsinline=1&autoplay=1" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen title="Video"></iframe>`;
          return;
        }
        vFail = true; failVideo(v.id);
      }
    } }));
  ytPending = videoPhase;
}
function failVideo(id){
  const box = slides[idx] && slides[idx].el.querySelector('.vframe');
  if(!box || box.querySelector('.vfall')) return;
  const d = document.createElement('div'); d.className = 'vfall';
  d.innerHTML = `<div><p>Video tidak dapat diputar di halaman ini.<br>Tekan tombol › untuk lanjut.</p><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Tonton di YouTube</a></div>`;
  box.appendChild(d);
  if(playing){ clearTimeout(advTimer); advTimer = setTimeout(() => { if(vFail) go(idx + 1, true); }, 4000); }
}
function ytStart(){
  try{ yt.playVideo(); }catch(e){}
  const t = tok;
  setTimeout(() => {
    if(t !== tok || !videoPhase || !yt || vFail) return;
    try{
      const st = yt.getPlayerState();
      if(st !== 1 && st !== 3){ yt.mute(); yt.playVideo(); note.dataset.m = 1; note.textContent = 'Video diputar tanpa suara karena pembatasan browser. Ketuk ikon speaker pada video untuk menyalakan suara.'; }
    }catch(e){}
  }, 2500);
}
function vPlay(){
  if(vel){ const pr = vel.play(); if(pr && pr.catch) pr.catch(() => {}); }
  else if(yt){ if(ytReady) ytStart(); else ytPending = true; }
}
function vPause(){
  if(vel){ try{ vel.pause(); }catch(e){} }
  else if(yt && ytReady){ try{ yt.pauseVideo(); }catch(e){} }
  ytPending = false;
}
function startVideo(token){
  if(token !== tok || !playing) return;
  videoPhase = true;
  cap.textContent = '';
  if(vFail) return;
  Music.duck(true, 0);
  vPlay();
}
function endVideo(){
  if(!videoPhase) return;
  videoPhase = false;
  Music.duck(false);
  if(playing) advTimer = setTimeout(() => go(idx + 1, true), 1500);
}
function startGallery(s){
  clearInterval(galTimer);
  if(!s.gallery || !galPool.length) return;
  const cells = [...s.el.querySelectorAll('.cell')];
  let ptr = s.off || 0, k = 0;
  const put = (cell, src) => {
    const imgs = [...cell.querySelectorAll('img')];
    const cur = imgs.find(i => i.classList.contains('on'));
    const nx = imgs.find(i => i !== cur) || imgs[0];
    nx.onload = () => { if(cur) cur.classList.remove('on'); nx.classList.add('on'); };
    nx.src = src;
  };
  cells.forEach(c => put(c, galPool[ptr++ % galPool.length]));
  galTimer = setInterval(() => { if(!document.body.classList.contains('paused')) put(cells[k++ % cells.length], galPool[ptr++ % galPool.length]); }, 2800);
}

function speakFrom(slideI, from, token){
  const s = slides[slideI];
  if(!narOn){
    if(s.video){ cap.textContent = ''; advTimer = setTimeout(() => startVideo(token), 1500); return; }
    const chars = s.say.join(' ').length;
    const ms = s.gallery ? 40000 : Math.max(9000, chars * 70);
    let t0 = performance.now();
    (function loop(){
      if(token !== tok) return;
      prog.style.transition = 'none';
      prog.style.width = Math.min(100, ((slideI + Math.min(1, (performance.now() - t0) / ms)) / slides.length) * 100) + '%';
      if(performance.now() - t0 >= ms){ go(slideI + 1, true); return; }
      advTimer = setTimeout(loop, 250);
    })();
    cap.textContent = '';
    return;
  }
  const lines = s.say;
  const next = i => {
    if(token !== tok) return;
    if(i >= lines.length){
      if(s.video){ advTimer = setTimeout(() => startVideo(token), 500); return; }
      Music.duck(false); advTimer = setTimeout(() => { if(token === tok) go(slideI + 1, true); }, s.gallery ? 2500 : 1800); return;
    }
    sentIdx = i;
    cap.textContent = lines[i];
    prog.style.transition = 'width .6s ease';
    prog.style.width = ((slideI + i / lines.length) / slides.length * 100) + '%';
    const u = new SpeechSynthesisUtterance(sp(lines[i]));
    u.lang = 'id-ID'; if(voice) u.voice = voice; u.rate = 1; u.pitch = 1; u.volume = 1;
    let done = false;
    const fin = () => { if(done) return; done = true; clearTimeout(guard); if(token === tok) setTimeout(() => next(i + 1), 200); };
    u.onend = fin;
    u.onerror = e => { if(e.error === 'canceled' || e.error === 'interrupted') return; fin(); };
    const guard = setTimeout(fin, Math.max(6000, lines[i].length * 150));
    Music.duck(true);
    synth.speak(u);
  };
  next(from);
}

function go(n, auto){
  clearTimeout(advTimer);
  if(synth) synth.cancel();
  if(videoPhase){ videoPhase = false; Music.duck(false); }
  disposeVideo();
  tok++;
  idx = (n + slides.length) % slides.length;
  slides.forEach((s, i) => s.el.classList.toggle('on', i === idx));
  dots.forEach((d, i) => d.classList.toggle('on', i === idx));
  dotsEl.classList.toggle('hide', !!slides[idx].video);
  stage.classList.toggle('isvid', !!slides[idx].video);
  if(note.dataset.m){ note.textContent = ''; delete note.dataset.m; }
  startRotate(slides[idx].el);
  startGallery(slides[idx]);
  if(slides[idx].video) prepareVideo(slides[idx], idx);
  cap.textContent = '';
  sentIdx = 0;
  prog.style.width = (idx / slides.length * 100) + '%';
  if(playing){ const t = tok; setTimeout(() => { if(t === tok && playing) speakFrom(idx, 0, t); }, 750); }
}

function setPlaying(b){
  playing = b;
  document.body.classList.toggle('paused', !b);
  $('play').textContent = b ? 'Ⅱ' : '▶';
  if(b) showHud(); else { clearTimeout(hudT); stage.classList.add('hud-on'); }
  if(b){
    Music.suspend(false); const t = ++tok;
    if(videoPhase){ Music.duck(true, 0); vPlay(); }
    else speakFrom(idx, sentIdx, t);
  } else {
    tok++; clearTimeout(advTimer); if(synth) synth.cancel();
    if(videoPhase) vPause();
    Music.duck(false);
    Music.suspend(true);
  }
}
$('start').onclick = () => {
  $('cover').classList.add('gone');
  showHud();
  Music.start();
  playing = true; go(0);
};
$('prev').onclick = () => go(idx - 1);
$('next').onclick = () => go(idx + 1);
$('play').onclick = () => setPlaying(!playing);
$('vc').onclick = () => {
  if(!voices.length){ note.dataset.m = 1; note.textContent = 'Tidak ada suara bahasa Indonesia di perangkat ini.'; return; }
  vi = (vi + 1) % voices.length; voice = voices[vi];
  note.dataset.m = 1; note.textContent = 'Suara: ' + voice.name + ' (' + (vi + 1) + '/' + voices.length + ')';
  if(playing && !videoPhase){ if(synth) synth.cancel(); const t = ++tok; speakFrom(idx, sentIdx, t); }
};
$('full').onclick = async () => {
  try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }
  catch(e){ note.textContent = 'Layar penuh tidak didukung browser ini.'; }
};
document.addEventListener('keydown', e => {
  if(!$('cover').classList.contains('gone')) return;
  const k = e.key.toLowerCase();
  if(e.key === 'ArrowRight') go(idx + 1);
  else if(e.key === 'ArrowLeft') go(idx - 1);
  else if(e.key === ' '){ e.preventDefault(); setPlaying(!playing); }
  else if(k === 'f') $('full').click();
});
if(!synth){ note.textContent = 'Browser ini tidak mendukung suara narasi; slide berganti otomatis.'; }

/* ===== KONTROL ALA PEMUTAR VIDEO ===== */
const stage = $('stage'); let hudT = null;
function showHud(){
  stage.classList.add('hud-on'); clearTimeout(hudT);
  if(playing) hudT = setTimeout(() => stage.classList.remove('hud-on'), 2800);
}
stage.addEventListener('mousemove', showHud);
stage.addEventListener('touchstart', showHud, {passive:true});
stage.addEventListener('click', e => {
  if(e.target.closest('button,.dots')) return;
  if(slides[idx] && slides[idx].video) { showHud(); return; }
  setPlaying(!playing);
});
document.addEventListener('visibilitychange', () => { if(document.hidden && playing) setPlaying(false); });

async function ytTitle(id){
  try{
    const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id));
    if(r.status === 401 || r.status === 403 || r.status === 404) return { bad:true };
    if(!r.ok) return null;
    const j = await r.json(); return { title: j.title || '' };
  }catch(e){ return null; }
}
const clean = t => String(t || '').replace(/#\S+/g, '').replace(/\s+/g, ' ').trim();
(async function init(){
  const btn = $('start');
  btn.disabled = true; btn.textContent = 'Memuat foto dan video…';
  const limit = (p, ms, fb) => Promise.race([p, new Promise(r => setTimeout(() => r(fb), ms))]);
  await limit(initGalleryPool(), 7000, null);
  const LIST = [
    /* ============================================================
       ★★★ GANTI LINK YOUTUBE DI SINI ★★★
       Isi 'id' dengan KODE video YouTube Anda saja, bukan link lengkap.
       Contoh:
         https://youtube.com/shorts/F1F_SrOri2A  →  id: 'F1F_SrOri2A'
         https://www.youtube.com/watch?v=ABC123  →  id: 'ABC123'
         https://youtu.be/ABC123                 →  id: 'ABC123'
       Jika videonya BIASA (landscape, bukan Shorts), ubah short:true menjadi short:false
       ============================================================ */
    { id:'sqrdzhm1KJ0', short:false,   /* ← ★ GANTI KODE VIDEO DI SINI ★ */
      kick:'Kegiatan Sekolah · Senam',
      judul:'Senam Anak Indonesia Hebat | SMPN 20 Konawe Selatan', fixed:true,
      say:['Kegiatan senam anak Indonesia hebat.',
           'Senam Anak Indonesia Hebat adalah kegiatan olahraga bersama yang rutin dilaksanakan oleh siswa dan guru SMP Negeri 20 Konawe Selatan.',
           'Kegiatan ini sejalan dengan gerakan tujuh kebiasaan anak Indonesia hebat, salah satunya adalah berolahraga.',
           'Melalui senam, siswa dibiasakan hidup sehat, bugar, dan aktif bergerak sejak pagi hari.',
           'Kegiatan ini juga menumbuhkan semangat kebersamaan, kedisiplinan, dan keceriaan di lingkungan sekolah.',
           'Silakan simak videonya.'] }
  ];
  btn.textContent = 'Menyiapkan video…';
  const metas = await limit(Promise.all(LIST.map(v => ytTitle(v.id))), 4500, LIST.map(() => null));
  const vids = LIST.map((v, i) => {
    const got = clean(metas[i] && metas[i].title);
    const t = v.fixed ? v.judul : (got || v.judul);
    let say;
    if(v.say) say = v.say;
    else if(v.short) say = got
      ? ['Berikutnya, video singkat dari SMP Negeri 20 Konawe Selatan.', 'Video ini berjudul ' + got + '.', 'Silakan simak videonya.']
      : ['Berikutnya, video singkat dokumentasi SMP Negeri 20 Konawe Selatan.', 'Silakan simak videonya.'];
    else say = [v.intro, t + '.'];
    return videoSlide({t: v.mp4 ? 'mp4' : 'yt', src: v.mp4, id:v.id, short:!!v.short}, v.kick, t, say);
  });
  const b = baseSlides();
  slides = b.awal.concat(vids, b.akhir);
  build();
  slides[0].el.classList.add('on'); dots[0].classList.add('on'); startRotate(slides[0].el);
  fitAll(); setTimeout(fitAll, 300); setTimeout(fitAll, 1500);
  btn.disabled = false; btn.textContent = '▶ Mulai';
})();
})();
</script>
