<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Statistik</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/admin.css"> 

<style>
body{
  display:none;
}
</style>

<script type="module"
src="../assets/js/auth-guard.js">
</script>
</head>
<body>
 <div id="sidebar"></div>

<h2>Statistik Sekolah (AUTO)</h2>

<p>Guru: <span id="guru"></span></p>
<p>Siswa: <span id="siswa"></span></p>

<button onclick="sync()">Sync Statistik</button>

<script type="module">
import { getGuru, getSiswa, setStatistik } from "../assets/js/services.js";

async function load(){
  guru.innerText = (await getGuru()).length;
  siswa.innerText = (await getSiswa()).length;
}

window.sync = async () => {
  const g = await getGuru();
  const s = await getSiswa();

  await setStatistik({
    guru: g.length,
    siswa: s.length,
    alumni: 840
  });

  alert("Statistik updated");
};

load();
</script>
 <script type="module" src="../assets/js/sidebar.js"></script>
</body>
</html>
