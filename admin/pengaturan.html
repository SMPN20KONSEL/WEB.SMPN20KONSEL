  </div>

        <input id="namaSekolah">
      </div>

      </div>

      <div class="form-group">
        <label>Alamat</label>
        <textarea id="alamat"></textarea>
      </div>

        <i class="fas fa-save"></i> Simpan Setting
      </button>

    </div>

  </div>

<!-- ================= FIREBASE ================= -->
<script type="module">

import { db } from "../assets/js/firebase.js";
import { doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* LOAD */
async function loadData(){

  const snap = await getDoc(doc(db,"website","setting"));

  if(snap.exists()){
    const d = snap.data();

    namaSekolah.value = d.namaSekolah || "";
    motto.value = d.motto || "";
    email.value = d.email || "";
    telepon.value = d.telepon || "";
    alamat.value = d.alamat || "";
  }
}

/* SIMPAN */
window.simpan = async () => {

  await setDoc(doc(db,"website","setting"),{
    namaSekolah: namaSekolah.value,
    motto: motto.value,
    email: email.value,
    telepon: telepon.value,
    alamat: alamat.value
  });

  alert("Setting berhasil disimpan");
};

loadData();

</script>
