<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
  Admin Berita Firebase
</title>

<!-- FONT AWESOME -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =========================
   GLOBAL
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:#f5f5f5;
  padding:40px 0;
}

/* =========================
   CONTAINER
========================= */

.container{
  width:90%;
  max-width:1100px;
  margin:auto;
}

.title{
  font-size:40px;
  color:#0b2b4d;
  margin-bottom:10px;
}

.subtitle{
  color:#666;
  margin-bottom:40px;
}

/* =========================
   FORM
========================= */

.form-box{
  background:white;
  padding:35px;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-group{
  margin-bottom:25px;
}

.form-group label{
  display:block;
  margin-bottom:10px;
  font-size:17px;
  font-weight:bold;
}

.form-group input,
.form-group textarea{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:16px;
}

.form-group textarea{
  min-height:220px;
  resize:vertical;
  line-height:1.8;
}

.form-group input:focus,
.form-group textarea:focus{
  border-color:#ff9800;
}

/* =========================
   BUTTON
========================= */

.btn{
  padding:15px 30px;
  background:#ff9800;
  color:white;
  border:none;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.btn:hover{
  background:#e68900;
}

/* =========================
   LIST BERITA
========================= */

.list-berita{
  margin-top:50px;
}

.berita-card{
  background:white;
  padding:25px;
  border-radius:20px;
  margin-bottom:25px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.berita-card h2{
  color:#0b2b4d;
  margin-bottom:10px;
}

.berita-card small{
  color:#777;
}

.berita-card img{
  width:100%;
  max-height:450px;
  object-fit:cover;
  border-radius:15px;
  margin-top:20px;
}

.berita-card p{
  line-height:1.9;
  text-align:justify;
  margin-top:20px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

  .title{
    font-size:30px;
  }

  .form-box{
    padding:25px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- TITLE -->

  <h1 class="title">
    Admin Berita Sekolah
  </h1>

  <p class="subtitle">
    Tambahkan berita SMPN 20 Konawe Selatan
  </p>

  <!-- FORM -->

  <div class="form-box">

    <!-- JUDUL -->

    <div class="form-group">

      <label>
        Judul Berita
      </label>

      <input
      type="text"
      id="judul"
      placeholder="Masukkan judul berita">

    </div>

    <!-- TANGGAL -->

    <div class="form-group">

      <label>
        Tanggal
      </label>

      <input
      type="date"
      id="tanggal">

    </div>

    <!-- PENULIS -->

    <div class="form-group">

      <label>
        Penulis
      </label>

      <input
      type="text"
      id="penulis"
      placeholder="Nama penulis">

    </div>

    <!-- KATEGORI -->

    <div class="form-group">

      <label>
        Kategori
      </label>

      <input
      type="text"
      id="kategori"
      placeholder="contoh: kegiatan">

    </div>

    <!-- GAMBAR 1 -->

    <div class="form-group">

      <label>
        URL Gambar 1
      </label>

      <input
      type="text"
      id="gambar1"
      placeholder="../image/berita1.jpg">

    </div>

    <!-- GAMBAR 2 -->

    <div class="form-group">

      <label>
        URL Gambar 2
      </label>

      <input
      type="text"
      id="gambar2"
      placeholder="../image/berita2.jpg">

    </div>

    <!-- ISI -->

    <div class="form-group">

      <label>
        Isi Berita
      </label>

      <textarea
      id="isi"
      placeholder="Tulis isi berita...

Tekan ENTER untuk membuat paragraf baru"></textarea>

    </div>

    <!-- BUTTON -->

    <button
    class="btn"
    id="btnSimpan">

      <i class="fas fa-save"></i>

      Simpan Berita

    </button>

  </div>

  <!-- LIST BERITA -->

  <div
  class="list-berita"
  id="listBerita">

    <p>
      Memuat berita...
    </p>

  </div>

</div>

<!-- =========================
     FIREBASE SCRIPT
========================= -->

<script type="module">

/* =========================
   IMPORT DATABASE
========================= */

import { db }
from "../assets/js/firebase.js";

import {

  collection,
  doc,
  setDoc,
  getDocs,
  query,
  orderBy

}
from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* =========================
   ELEMENT
========================= */

const btnSimpan =
document.getElementById(
  "btnSimpan"
);

const listBerita =
document.getElementById(
  "listBerita"
);

/* =========================
   BUAT ID DOKUMEN
========================= */

function buatId(judul){

  return judul

  .toLowerCase()

  .trim()

  .replace(/\s+/g,"-")

  .replace(/[^a-z0-9-]/g,"");

}

/* =========================
   TAMPIL BERITA
========================= */

async function tampilBerita(){

  listBerita.innerHTML = `
    <p>Memuat berita...</p>
  `;

  try{

    const q = query(

      collection(
        db,
        "berita"
      ),

      orderBy(
        "createdAt",
        "desc"
      )

    );

    const snapshot =
    await getDocs(q);

    listBerita.innerHTML = "";

    if(snapshot.empty){

      listBerita.innerHTML = `
        <p>
          Belum ada berita
        </p>
      `;

      return;

    }

    snapshot.forEach((item)=>{

      const data =
      item.data();

      listBerita.innerHTML += `

        <div class="berita-card">

          <h2>
            ${data.judul || "-"}
          </h2>

          <small>

            ${data.tanggal || "-"}

            •

            ${data.penulis || "-"}

            •

            ${data.kategori || "-"}

          </small>

          <img
          src="${data.gambar1 || ''}"

          onerror="
          this.style.display='none'
          ">

          <img
          src="${data.gambar2 || ''}"

          onerror="
          this.style.display='none'
          ">

          <p>

            ${
              Array.isArray(data.isi)

              ?

              data.isi.join("<br><br>")

              :

              data.isi || "-"
            }

          </p>

        </div>

      `;

    });

  }catch(error){

    console.log(error);

    listBerita.innerHTML = `

      <p style="
      color:red;
      ">

        Gagal memuat berita

      </p>

    `;

  }

}

/* =========================
   SIMPAN BERITA
========================= */

btnSimpan.addEventListener(

"click",

async ()=>{

  const judul =
  document.getElementById(
    "judul"
  ).value.trim();

  const tanggal =
  document.getElementById(
    "tanggal"
  ).value;

  const penulis =
  document.getElementById(
    "penulis"
  ).value.trim();

  const kategori =
  document.getElementById(
    "kategori"
  ).value.trim();

  const gambar1 =
  document.getElementById(
    "gambar1"
  ).value.trim();

  const gambar2 =
  document.getElementById(
    "gambar2"
  ).value.trim();

  /* =========================
     ISI BERITA
  ========================= */

  const isiText =
  document.getElementById(
    "isi"
  ).value.trim();

  /*
    ubah paragraf menjadi array
  */

  const isi =

  isiText

  .split("\n")

  .map(
    item => item.trim()
  )

  .filter(
    item => item !== ""
  );

  if(

    !judul ||
    !tanggal ||
    !penulis ||
    !kategori ||
    isi.length === 0

  ){

    alert(
      "Lengkapi semua data"
    );

    return;

  }

  try{

    btnSimpan.disabled =
    true;

    btnSimpan.innerHTML = `

      <i class="fas fa-spinner fa-spin"></i>

      Menyimpan...

    `;

    const idBerita =
    buatId(judul);

    await setDoc(

      doc(
        db,
        "berita",
        idBerita
      ),

      {

        judul,
        tanggal,
        penulis,
        kategori,

        gambar1,
        gambar2,

        isi,

        createdAt:
        new Date()

      }

    );

    alert(
      "Berita berhasil disimpan"
    );

    /* RESET FORM */

    document.getElementById(
      "judul"
    ).value = "";

    document.getElementById(
      "tanggal"
    ).value = "";

    document.getElementById(
      "penulis"
    ).value = "";

    document.getElementById(
      "kategori"
    ).value = "";

    document.getElementById(
      "gambar1"
    ).value = "";

    document.getElementById(
      "gambar2"
    ).value = "";

    document.getElementById(
      "isi"
    ).value = "";

    tampilBerita();

  }catch(error){

    console.log(error);

    alert(
      error.message
    );

  }

  btnSimpan.disabled =
  false;

  btnSimpan.innerHTML = `

    <i class="fas fa-save"></i>

    Simpan Berita

  `;

});

/* =========================
   LOAD AWAL
========================= */

tampilBerita();

</script>

</body>
</html>
