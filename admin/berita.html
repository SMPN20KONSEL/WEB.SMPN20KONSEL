<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Berita Firebase</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--primary:#0b2b4d;
--secondary:#ff9800;
--bg:#f5f7fb;
--white:#fff;
--border:#e5e7eb;
}

.main{
margin-left:260px;
width:calc(100% - 260px);
min-height:100vh;
}
.topbar{
background:#fff;
padding:16px 25px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 12px rgba(0,0,0,.06);
position:sticky;
top:0;
z-index:999;
}
.topbar h1{font-size:20px;color:var(--primary)}
.admin-box{display:flex;align-items:center;gap:10px}
.admin-box img{
width:40px;height:40px;border-radius:50%;
object-fit:cover;
}
.container{
max-width:1200px;
margin:auto;
padding:25px;
}
.title{
font-size:36px;
color:var(--primary);
margin-bottom:10px;
}
.subtitle{
color:#64748b;
margin-bottom:25px;
}
.form-box,.list-berita{
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}
.grid-2{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}
.form-group{margin-bottom:20px}
.form-group label{
display:block;
margin-bottom:8px;
font-weight:600;
color:var(--primary);
}
.form-group input,
.form-group textarea{
width:100%;
padding:14px;
border:1px solid var(--border);
border-radius:12px;
font-size:15px;
}
.form-group textarea{
min-height:220px;
resize:vertical;
}
.form-group input:focus,
.form-group textarea:focus{
outline:none;
border-color:var(--secondary);
box-shadow:0 0 0 4px rgba(255,152,0,.15);
}
.btn{
border:none;
background:var(--secondary);
color:#fff;
padding:15px 25px;
border-radius:12px;
font-weight:700;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}
.btn:hover{background:#e68900}
.list-berita{margin-top:30px}
.table-wrapper{overflow-x:auto}
table{
width:100%;
border-collapse:collapse;
min-width:700px;
}
thead{
background:var(--primary);
color:#fff;
}
th,td{
padding:14px;
border-bottom:1px solid #eee;
text-align:left;
}
tbody tr:hover{background:#f8fafc}
@media(max-width:992px){
.main{margin-left:0;width:100%}
.grid-2{grid-template-columns:1fr}
.title{font-size:28px}
}
@media(max-width:768px){
.container{padding:15px}
.title{font-size:24px}
.form-box,.list-berita{padding:18px}
.btn{width:100%}
.admin-box span{display:none}
}
</style>
</head>
<body>
<div id="sidebar"></div>

<div class="main">

<div class="topbar">
<h1>Berita Sekolah Admin</h1>
<div class="admin-box">
<img src="../image/Logo_transparent.png" alt="Logo">
<span>Administrator</span>
</div>
</div>

<div class="container">

<h1 class="title">Tambahkan Berita SMPN 20 Konawe Selatan</h1>
<p class="subtitle">Kelola berita sekolah langsung dari Firebase Firestore.</p>

<div class="form-box">

<div class="form-group">
<label>Judul Berita</label>
<input type="text" id="judul" placeholder="Masukkan judul berita">
</div>

<div class="grid-2">

<div class="form-group">
<label>Tanggal</label>
<input type="date" id="tanggal">
</div>

<div class="form-group">
<label>Penulis</label>
<input type="text" id="penulis" placeholder="Nama penulis">
</div>

<div class="form-group">
<label>Kategori</label>
<input type="text" id="kategori" placeholder="Kegiatan">
</div>

<div class="form-group">
<label>URL Gambar 1</label>
<input type="text" id="gambar1">
</div>

<div class="form-group">
<label>URL Gambar 2</label>
<input type="text" id="gambar2">
</div>

</div>

<div class="form-group">
<label>Isi Berita</label>
<textarea id="isi"></textarea>
</div>

<button class="btn" id="btnSimpan">
<i class="fas fa-save"></i>
Simpan Berita
</button>

</div>

<div class="list-berita">
<div class="table-wrapper">
<table>
<thead>
<tr>
<th>No</th>
<th>Judul</th>
<th>Penulis</th>
<th>Tanggal</th>
</tr>
</thead>
<tbody id="listBerita">
<tr><td colspan="4">Memuat berita...</td></tr>
</tbody>
</table>
</div>
</div>

</div>
</div>
<script type="module" src="../assets/js/sidebar.js"></script>

<script type="module">

import { db } from "../assets/js/firebase.js";

import {
collection,
doc,
setDoc,
getDocs,
query,
orderBy,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const btnSimpan=document.getElementById("btnSimpan");
const listBerita=document.getElementById("listBerita");

function buatId(judul){
return judul.toLowerCase().trim()
.replace(/\s+/g,"-")
.replace(/[^a-z0-9-]/g,"");
}

async function tampilBerita(){

listBerita.innerHTML='<tr><td colspan="4">Memuat berita...</td></tr>';

try{

const q=query(
collection(db,"berita"),
orderBy("createdAt","desc")
);

const snapshot=await getDocs(q);

listBerita.innerHTML="";

if(snapshot.empty){
listBerita.innerHTML='<tr><td colspan="4">Belum ada berita</td></tr>';
return;
}

let no=1;

snapshot.forEach((item)=>{

const data=item.data();

listBerita.innerHTML+=`
<tr>
<td>${no++}</td>
<td>${data.judul||"-"}</td>
<td>${data.penulis||"-"}</td>
<td>${data.tanggal||"-"}</td>
</tr>
`;

});

}catch(error){

console.error(error);

listBerita.innerHTML=`
<tr>
<td colspan="4" style="color:red">
Gagal memuat berita
</td>
</tr>
`;

}

}

btnSimpan.addEventListener("click",async()=>{

const judul=document.getElementById("judul").value.trim();
const tanggal=document.getElementById("tanggal").value;
const penulis=document.getElementById("penulis").value.trim();
const kategori=document.getElementById("kategori").value.trim();
const gambar1=document.getElementById("gambar1").value.trim();
const gambar2=document.getElementById("gambar2").value.trim();

const isi=document.getElementById("isi").value
.split("\n")
.map(i=>i.trim())
.filter(i=>i!=='');

if(!judul||!tanggal||!penulis||!kategori||isi.length===0){
alert("Lengkapi semua data");
return;
}

try{

btnSimpan.disabled=true;

btnSimpan.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

await setDoc(
doc(db,"berita",buatId(judul)),
{
judul,
tanggal,
penulis,
kategori,
gambar1,
gambar2,
isi,
createdAt:serverTimestamp()
}
);

alert("Berita berhasil disimpan");

document.getElementById("judul").value="";
document.getElementById("tanggal").value="";
document.getElementById("penulis").value="";
document.getElementById("kategori").value="";
document.getElementById("gambar1").value="";
document.getElementById("gambar2").value="";
document.getElementById("isi").value="";

tampilBerita();

}catch(error){

console.error(error);
alert(error.message);

}

btnSimpan.disabled=false;

btnSimpan.innerHTML='<i class="fas fa-save"></i> Simpan Berita';

});

tampilBerita();

</script>

</body>
</html>
