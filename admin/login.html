<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:
  linear-gradient(135deg,#2563eb,#1e3a8a);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  width:360px;
  background:white;
  padding:35px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo i{
  font-size:55px;
  color:#2563eb;
  margin-bottom:10px;
}

.logo h2{
  color:#111827;
}

.logo p{
  color:#666;
  font-size:14px;
  margin-top:5px;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
  color:#333;
}

.input-box{
  position:relative;
}

.input-box input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

.input-box input:focus{
  border-color:#2563eb;
}

.input-box i{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  color:#666;
  cursor:pointer;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  opacity:0.7;
  cursor:not-allowed;
}

.error{
  background:#fee2e2;
  color:#dc2626;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  display:none;
  font-size:14px;
}

.success{
  background:#dcfce7;
  color:#15803d;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  display:none;
  font-size:14px;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:13px;
  color:#666;
}

</style>
</head>
<body>

<div class="login-box">

  <div class="logo">
    <i class="fas fa-user-shield"></i>
    <h2>Admin Panel</h2>
    <p>SMPN 20 Konawe Selatan</p>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <!-- EMAIL -->

  <div class="form-group">

    <label>Email</label>

    <div class="input-box">

      <input
      type="email"
      id="email"
      placeholder="Masukkan email">

      <i class="fas fa-envelope"></i>

    </div>

  </div>

  <!-- PASSWORD -->

  <div class="form-group">

    <label>Password</label>

    <div class="input-box">

      <input
      type="password"
      id="password"
      placeholder="Masukkan password">

      <i
      class="fas fa-eye"
      id="togglePassword"></i>

    </div>

  </div>

  <!-- BUTTON -->

  <button id="btnLogin" onclick="login()">

    <i class="fas fa-sign-in-alt"></i>
    Login

  </button>

  <div class="footer">
    © 2025 SMPN20KONSEL
  </div>

</div>

<!-- FIREBASE -->

<script type="module">

import { auth }
from "../assets/js/firebase.js";

import {

  signInWithEmailAndPassword,
  onAuthStateChanged

}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";


// ================= AUTO LOGIN =================

onAuthStateChanged(auth,(user)=>{

  if(user){

    location.href = "dashboard.html";

  }

});


// ================= TOGGLE PASSWORD =================

const togglePassword =
document.getElementById("togglePassword");

const password =
document.getElementById("password");

togglePassword.addEventListener("click",()=>{

  const type =
  password.type === "password"
  ? "text"
  : "password";

  password.type = type;

  togglePassword.classList.toggle("fa-eye");
  togglePassword.classList.toggle("fa-eye-slash");

});


// ================= LOGIN =================

window.login = async function(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value.trim();

  const btn =
  document.getElementById("btnLogin");

  const error =
  document.getElementById("error");

  const success =
  document.getElementById("success");

  error.style.display = "none";
  success.style.display = "none";

  // VALIDASI

  if(!email || !password){

    error.innerHTML =
    "Semua field wajib diisi";

    error.style.display = "block";

    return;
  }

  try{

    btn.disabled = true;

    btn.innerHTML =
    '<i class="fas fa-spinner fa-spin"></i> Loading...';

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    success.innerHTML =
    "Login berhasil";

    success.style.display = "block";

    setTimeout(()=>{

      location.href = "dashboard.html";

    },1000);

  }catch(err){

    let pesan = "Login gagal";

    if(err.code === "auth/invalid-email"){

      pesan = "Email tidak valid";

    }

    else if(
      err.code === "auth/user-not-found"
    ){

      pesan = "Akun tidak ditemukan";

    }

    else if(
      err.code === "auth/wrong-password"
    ){

      pesan = "Password salah";

    }

    else if(
      err.code === "auth/invalid-credential"
    ){

      pesan = "Email atau password salah";

    }

    error.innerHTML = pesan;

    error.style.display = "block";

  }finally{

    btn.disabled = false;

    btn.innerHTML =
    '<i class="fas fa-sign-in-alt"></i> Login';

  }

}

</script>

</body>
</html>
