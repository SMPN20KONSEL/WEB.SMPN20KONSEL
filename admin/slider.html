<style>

/* ================= MAIN ================= */

.main{
  margin-left:260px;
  width:100%;
  padding:30px;
}

/* ================= FORM ================= */

.box{
  max-width:550px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 25px rgba(0,0,0,0.08);
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#0d6efd;
}
/* =========================
   DROPDOWN JABATAN
========================= */

#judul{
  width:100%;
  padding:14px 16px;
  border:2px solid #1e88e5;
  border-radius:12px;
  background:#fff;
  font-size:16px;
  font-weight:500;
  color:#222;
  outline:none;
  transition:0.3s;
  cursor:pointer;
  box-sizing:border-box;
}

#judul:focus{
  border-color:#1565c0;
  box-shadow:0 0 10px rgba(30,136,229,.25);
}

#judul option{
  padding:10px;
  font-size:15px;
}
input,
select,
button{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:12px;
  font-size:15px;
}

input:focus,
select:focus{
  outline:none;
  border-color:#0d6efd;
}

button{
  background:#0d6efd;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#0b5ed7;
  transform:translateY(-2px);
}

/* ================= PREVIEW ================= */

.preview{
  margin-top:20px;
  text-align:center;
  background:#f8fafc;
  padding:20px;
  border-radius:15px;
}

.preview img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #0d6efd;
}

.preview h3{
  margin-top:10px;
  margin-bottom:5px;
}

.preview p{
  color:#666;
}

/* ================= OUTPUT ================= */

.output{
  max-width:1100px;
  margin:40px auto;
}

.section-title{
  margin-top:40px;
  margin-bottom:12px;
  color:#0d6efd;
  font-size:24px;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

th,
td{
  padding:14px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#0d6efd;
  color:white;
}

td img{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
}

table tr:hover{
  background:#f9fafb;
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

  body{
    display:block;
    padding:0;
  }

  .sidebar{
    width:100%;
    height:auto;
    position:relative;
  }

  .main{
    margin-left:0;
    padding:15px;
  }

  .box{
    padding:20px;
  }

  table{
    font-size:13px;
  }

}

</style>

 <script type="module" src="../assets/js/sidebar.js"></script>
<script type="module">

import { db } from "../assets/js/firebase.js";

import {

  collection,
  getDocs,
  onSnapshot,
  doc,
  setDoc,
  deleteDoc

} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ================= ELEMENT ================= */

const guruSelect =
document.getElementById("guruSelect");

const preview =
document.getElementById("preview");

const output =
document.getElementById("output");

/* ================= DATA ================= */

let guruList = [];

let selectedGuru = null;

/* ================= LOAD GURU ================= */

async function loadGuru(){

  try{

    const snap = await getDocs(
      collection(db, "guru")
    );

    guruSelect.innerHTML = `

      <option value="">
        -- Pilih Guru --
      </option>

    `;

    guruList = [];

    snap.forEach((docSnap)=>{

      const data = docSnap.data();

      const guru = {

        uid: docSnap.id,

        nama: data.nama || "-",

        nip: data.nip || "-",

        nohp: data.nohp || "-",

        foto:
          data.foto ||
          `../image/guru/${data.nip}.jpg`

      };

      guruList.push(guru);

      guruSelect.innerHTML += `

        <option value="${docSnap.id}">
          ${data.nama}
        </option>

      `;

    });

  }catch(err){

    console.log(err);

    alert(
      "ERROR LOAD GURU:\n" +
      err.message
    );

  }

}

/* ================= PILIH GURU ================= */

guruSelect.addEventListener("change", ()=>{

  const uid = guruSelect.value;

  selectedGuru = guruList.find(
    g => g.uid === uid
  );

  if(selectedGuru){

    preview.innerHTML = `

      <img
        src="${selectedGuru.foto}"
        onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'"
      >

      <h3>${selectedGuru.nama}</h3>

      <p>${selectedGuru.nip}</p>

      <p>${selectedGuru.nohp}</p>

    `;

  }else{

    preview.innerHTML = `
      <p>Pilih guru untuk melihat data</p>
    `;

  }

});

/* ================= SIMPAN ================= */

window.simpan = async function(){

  try{

    const judul =
      document.getElementById("judul")
      .value;

    const jabatan =
      document.getElementById("jabatan")
      .value;

    if(
      judul === "" ||
      jabatan === "" ||
      !selectedGuru
    ){

      alert("Lengkapi data!");
      return;

    }

    const idDoc =
      judul
      .toLowerCase()
      .replace(/\s+/g,"-");

    await setDoc(

      doc(
        db,
        "jabatan",
        idDoc
      ),

      {

        judul: judul,

        uid: selectedGuru.uid,

        nama: selectedGuru.nama,

        nip: selectedGuru.nip,

        nohp: selectedGuru.nohp,

        foto: selectedGuru.foto,

        jabatan: jabatan

      }

    );

    alert("Data berhasil disimpan");

    /* RESET */

    document.getElementById(
      "judul"
    ).selectedIndex = 0;

    document.getElementById(
      "jabatan"
    ).selectedIndex = 0;

    guruSelect.selectedIndex = 0;

    selectedGuru = null;

    preview.innerHTML = `
      <p>Pilih guru untuk melihat data</p>
    `;

  }catch(err){

    console.log(err);

    alert(
      "Gagal menyimpan:\n" +
      err.message
    );

  }

};

/* ================= HAPUS ================= */

window.hapusData = async function(id){

  const konfirmasi =
  confirm("Yakin ingin menghapus data?");

  if(!konfirmasi) return;

  try{

    await deleteDoc(

      doc(db, "jabatan", id)

    );

    alert("Data berhasil dihapus");

  }catch(err){

    console.log(err);

    alert(
      "Gagal menghapus:\n" +
      err.message
    );

  }

};

/* ================= RENDER ================= */

function renderData(){

  onSnapshot(

    collection(db, "jabatan"),

    (snap)=>{

      output.innerHTML = "";

      if(snap.empty){

        output.innerHTML = `
          <p>Belum ada data</p>
        `;

        return;

      }

      snap.forEach((docSnap)=>{

        const d = docSnap.data();

        const judul =
          d.judul || "-";

        output.innerHTML += `

          <div class="section-title">
            ${judul.toUpperCase()}
          </div>

          <table>

            <tr>
              <th>Foto</th>
              <th>Nama</th>
              <th>NIP</th>
              <th>No HP</th>
              <th>Jabatan</th>
              <th>Aksi</th>
            </tr>

            <tr>

              <td>

                <img
                  src="${d.foto}"
                  onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'"
                >

              </td>

              <td>
                ${d.nama || "-"}
              </td>

              <td>
                ${d.nip || "-"}
              </td>

              <td>
                ${d.nohp || "-"}
              </td>

              <td>
                ${d.jabatan || "-"}
              </td>

              <td>

                <button
                  onclick="hapusData('${docSnap.id}')"
                  style="
                    background:red;
                    color:white;
                    border:none;
                    padding:8px 12px;
                    border-radius:8px;
                    cursor:pointer;
                  "
                >
                  Hapus
                </button>

              </td>

            </tr>

          </table>

        `;

      });

    }

  );

}

/* ================= LOAD ================= */

loadGuru();

renderData();

</script>
