<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Jadwal BK</title>

<!-- GOOGLE FONT -->
<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<!-- FONT AWESOME -->
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- CSS GLOBAL -->
<link
rel="stylesheet"
href="../assets/css/admin.css">

<style>

/* ================= BODY ================= */

body{

  background:#eef3f9;

  font-family:'Poppins',sans-serif;

  overflow-x:hidden;

}

/* ================= MAIN ================= */

.main-content{

  margin-left:260px;

  width:calc(100% - 260px);

  min-height:100vh;

  padding:30px;

  box-sizing:border-box;

  transition:.3s;

}

/* ================= HEADER ================= */

.top-header{

  width:100%;

  min-height:180px;

  background:
  linear-gradient(
    135deg,
    #1976d2,
    #42a5f5
  );

  border-radius:30px;

  padding:35px;

  box-sizing:border-box;

  display:flex;
  justify-content:space-between;
  align-items:center;

  color:white;

  box-shadow:
  0 15px 40px rgba(25,118,210,.25);

  margin-bottom:30px;

}

.top-header h1{

  font-size:36px;

  font-weight:700;

  margin-bottom:10px;

}

.top-header p{

  font-size:16px;

  opacity:.95;

}

/* ================= ICON ================= */

.header-icon{

  width:100px;
  height:100px;

  border-radius:26px;

  background:
  rgba(255,255,255,.15);

  backdrop-filter:blur(10px);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:42px;

}

/* ================= CARD ================= */

.form-card,
.table-card{

  width:100%;

  background:white;

  border-radius:28px;

  padding:30px;

  box-sizing:border-box;

  margin-bottom:30px;

  box-shadow:
  0 5px 25px rgba(0,0,0,.06);

}

/* ================= GRID ================= */

.form-grid{

  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:24px;

}

/* ================= INPUT ================= */

.input-group{
  width:100%;
}

.input-group label{

  display:block;

  margin-bottom:10px;

  font-size:14px;
  font-weight:600;

  color:#374151;

}

.input-group input,
.input-group select{

  width:100%;

  height:58px;

  border-radius:18px;

  border:1px solid #d6deea;

  padding:0 18px;

  box-sizing:border-box;

  font-size:15px;

  outline:none;

  background:white;

  transition:.25s;

}

.input-group input:focus,
.input-group select:focus{

  border-color:#1976d2;

  box-shadow:
  0 0 0 5px rgba(25,118,210,.12);

}

/* ================= BUTTON ================= */

.btn-save{

  width:100%;

  height:60px;

  border:none;

  border-radius:18px;

  margin-top:28px;

  background:
  linear-gradient(
    135deg,
    #1976d2,
    #42a5f5
  );

  color:white;

  font-size:16px;
  font-weight:600;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;

  transition:.3s;

}

.btn-save:hover{

  transform:translateY(-2px);

  box-shadow:
  0 10px 25px rgba(25,118,210,.25);

}

/* ================= TABLE ================= */

.table-title{
  margin-bottom:20px;
}

.table-title h3{

  font-size:22px;

  color:#1e293b;

}

.table-responsive{
  overflow-x:auto;
}

table{

  width:100%;

  border-collapse:collapse;

  min-width:850px;

}

thead{

  background:
  linear-gradient(
    135deg,
    #1976d2,
    #42a5f5
  );

  color:white;

}

th{

  padding:18px;

  text-align:left;

  font-size:14px;
  font-weight:600;

}

td{

  padding:18px;

  border-bottom:1px solid #edf2f7;

  font-size:14px;

  color:#334155;

}

tbody tr{
  transition:.2s;
}

tbody tr:hover{
  background:#f8fbff;
}

/* ================= ACTION ================= */

.actions{

  display:flex;

  gap:10px;

}

.edit-btn,
.delete-btn{

  width:42px;
  height:42px;

  border:none;

  border-radius:14px;

  color:white;

  cursor:pointer;

  transition:.2s;

}

.edit-btn{
  background:#ff9800;
}

.delete-btn{
  background:#ef4444;
}

.edit-btn:hover,
.delete-btn:hover{
  transform:scale(1.08);
}

/* ================= EMPTY ================= */

.empty{

  text-align:center;

  padding:30px;

  color:#94a3b8;

}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .main-content{

    margin-left:0;

    width:100%;

    padding:15px;

  }

  .top-header{

    flex-direction:column;

    text-align:center;

    gap:20px;

    padding:25px;

  }

  .top-header h1{
    font-size:28px;
  }

  .header-icon{

    width:80px;
    height:80px;

    font-size:34px;

  }

  .form-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar"></div>

<!-- MAIN -->
<div class="main-content">

  <!-- HEADER -->
  <div class="top-header">

    <div>

      <h1>Jadwal BK</h1>

      <p>
        Kelola layanan
        bimbingan dan konseling sekolah
      </p>

    </div>

    <div class="header-icon">
      <i class="fa-solid fa-calendar-check"></i>
    </div>

  </div>

  <!-- FORM -->
  <div class="form-card">

    <input
    type="hidden"
    id="docId">

    <div class="form-grid">

      <!-- HARI -->
      <div class="input-group">

        <label>Hari</label>

        <select id="hari">

          <option value="">
            Pilih Hari
          </option>

          <option>Senin</option>
          <option>Selasa</option>
          <option>Rabu</option>
          <option>Kamis</option>
          <option>Jumat</option>
          <option>Sabtu</option>

        </select>

      </div>

      <!-- JAM -->
      <div class="input-group">

        <label>Jam</label>

        <input
        type="time"
        id="jam">

      </div>

      <!-- LAYANAN -->
      <div class="input-group">

        <label>Layanan</label>

        <select id="layanan">

          <option value="">
            Pilih Layanan
          </option>

          <option>
            Konseling Individu
          </option>

          <option>
            Bimbingan Belajar
          </option>

          <option>
            Konseling Kelompok
          </option>

          <option>
            Bimbingan Karier
          </option>

          <option>
            Karakter
          </option>

          <option>
            Orang Tua
          </option>

        </select>

      </div>

      <!-- RUANGAN -->
      <div class="input-group">

        <label>Ruangan</label>

        <select id="ruangan">

          <option value="">
            Pilih Ruangan
          </option>

          <option>Ruang BK</option>

          <option>
            Ruang Guru BK
          </option>

          <option>
            Ruang Kelas
          </option>

          <option>
            Ruang Konseling Individu
          </option>

          <option>
            Ruang Konseling Kelompok
          </option>

          <option>
            Ruang Multimedia
          </option>

        </select>

      </div>

    </div>

    <!-- BUTTON -->
    <button
    class="btn-save"
    id="btnSimpan"
    onclick="simpanData()">

      <i class="fa-solid fa-floppy-disk"></i>

      Simpan Jadwal

    </button>

  </div>

  <!-- TABLE -->
  <div class="table-card">

    <div class="table-title">

      <h3>
        Daftar Jadwal BK
      </h3>

    </div>

    <div class="table-responsive">

      <table>

        <thead>

          <tr>

            <th>Hari</th>
            <th>Jam</th>
            <th>Layanan</th>
            <th>Ruangan</th>
            <th>Aksi</th>

          </tr>

        </thead>

        <tbody id="tabel">

          <tr>
            <td
            colspan="5"
            class="empty">

            Memuat data...

            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

<!-- SIDEBAR -->
<script
type="module"
src="../assets/js/sidebar.js">
</script>

<!-- FIREBASE -->
<script type="module">

import { db }
from "../assets/js/firebase.js";

import {

  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc,
  query,
  orderBy

} from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ================= COLLECTION ================= */

const ref =
collection(db,"jadwalbk");

/* ================= LOAD DATA ================= */

async function loadData(){

  const tabel =
  document.getElementById("tabel");

  tabel.innerHTML = `
    <tr>
      <td
      colspan="5"
      class="empty">
      Memuat data...
      </td>
    </tr>
  `;

  try{

    const q =
    query(
      ref,
      orderBy("hari")
    );

    const snap =
    await getDocs(q);

    tabel.innerHTML = "";

    if(snap.empty){

      tabel.innerHTML = `
        <tr>
          <td
          colspan="5"
          class="empty">

          Belum ada data jadwal

          </td>
        </tr>
      `;

      return;
    }

    snap.forEach((d)=>{

      const data = d.data();

      tabel.innerHTML += `

      <tr>

        <td>${data.hari}</td>

        <td>${data.jam}</td>

        <td>${data.layanan}</td>

        <td>${data.ruangan}</td>

        <td>

          <div class="actions">

            <button
            class="edit-btn"

            onclick="
            editData(
            '${d.id}',
            '${data.hari}',
            '${data.jam}',
            '${data.layanan}',
            '${data.ruangan}'
            )">

            <i class="fa-solid fa-pen"></i>

            </button>

            <button
            class="delete-btn"

            onclick="
            hapusData(
            '${d.id}'
            )">

            <i class="fa-solid fa-trash"></i>

            </button>

          </div>

        </td>

      </tr>

      `;
    });

  }catch(err){

    console.error(err);

    tabel.innerHTML = `
      <tr>
        <td
        colspan="5"
        class="empty">

        Gagal memuat data

        </td>
      </tr>
    `;
  }
}

/* ================= SIMPAN ================= */

window.simpanData =
async function(){

  const id =
  document.getElementById("docId").value;

  const hari =
  document.getElementById("hari").value;

  const jam =
  document.getElementById("jam").value;

  const layanan =
  document.getElementById("layanan").value;

  const ruangan =
  document.getElementById("ruangan").value;

  if(
    !hari ||
    !jam ||
    !layanan ||
    !ruangan
  ){
    alert(
      "Lengkapi data!"
    );
    return;
  }

  try{

    if(id){

      await updateDoc(
        doc(db,"jadwalbk",id),
        {
          hari,
          jam,
          layanan,
          ruangan
        }
      );

      alert(
        "Data berhasil diupdate"
      );

    }else{

      await addDoc(ref,{

        hari,
        jam,
        layanan,
        ruangan,

        createdAt:
        new Date()

      });

      alert(
        "Data berhasil disimpan"
      );

    }

    resetForm();

    loadData();

  }catch(err){

    console.error(err);

    alert(err.message);

  }

};

/* ================= EDIT ================= */

window.editData =
function(
  id,
  hari,
  jam,
  layanan,
  ruangan
){

  document.getElementById(
    "docId"
  ).value = id;

  document.getElementById(
    "hari"
  ).value = hari;

  document.getElementById(
    "jam"
  ).value = jam;

  document.getElementById(
    "layanan"
  ).value = layanan;

  document.getElementById(
    "ruangan"
  ).value = ruangan;

  document.getElementById(
    "btnSimpan"
  ).innerHTML = `

    <i class="fa-solid fa-pen"></i>

    Update Jadwal

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};

/* ================= HAPUS ================= */

window.hapusData =
async function(id){

  const konfirmasi =
  confirm(
    "Yakin ingin menghapus data?"
  );

  if(!konfirmasi) return;

  try{

    await deleteDoc(
      doc(db,"jadwalbk",id)
    );

    loadData();

  }catch(err){

    console.error(err);

    alert(err.message);

  }

};

/* ================= RESET ================= */

function resetForm(){

  document.getElementById(
    "docId"
  ).value = "";

  document.getElementById(
    "hari"
  ).value = "";

  document.getElementById(
    "jam"
  ).value = "";

  document.getElementById(
    "layanan"
  ).value = "";

  document.getElementById(
    "ruangan"
  ).value = "";

  document.getElementById(
    "btnSimpan"
  ).innerHTML = `

    <i class="fa-solid fa-floppy-disk"></i>

    Simpan Jadwal

  `;

}

/* ================= INIT ================= */

loadData();

</script>

</body>
</html>
