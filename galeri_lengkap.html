<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Galeri Lengkap</title>

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet"/>
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/header-footer.css">
  <link rel="stylesheet" href="assets/css/galeri_lengkap.css">

</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<!-- TOMBOL KEMBALI -->
<a href="galeri.html" class="back-link">
  ← Kembali
</a>

<!-- JUDUL -->
<h2>Galeri SMPN 20 Konawe Selatan</h2>

<!-- GALERI -->
<div
  class="gallery-full"
  id="galleryFull">
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- INCLUDE HEADER FOOTER -->
<script
  type="module"
  src="assets/js/include.js">
</script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="assets/js/aos-global.js"></script>
<!-- MENU MOBILE -->
<script>
document.addEventListener(
  "DOMContentLoaded",
  function () {

    const toggle =
    document.querySelector(".nav-toggle");

    const navLinks =
    document.querySelector(".nav-links");

    if (toggle && navLinks) {

      toggle.addEventListener(
        "click",
        function () {

          navLinks.classList.toggle(
            "active"
          );

        }
      );

    }

  }
);
</script>

<!-- AUTO GALERI -->
<script>

const gallery =
document.getElementById(
  "galleryFull"
);

/* FOTO MANUAL */
const photos = [

  "Gambar 1.jpg",
  "Gambar 2.jpg",
  "Gambar 3.jpg",
  "Gambar 4.jpg",
  "Gambar 5.jpg",

  "IMG-20250510-WA0005.jpg",
  "IMG-20250510-WA0006.jpg",
  "IMG-20250510-WA0007.jpg",

  "IMG-20250528-WA0005.jpg",

  "IMG-20250529-WA0002.jpg",
  "IMG-20250529-WA0004.jpg",
  "IMG-20250529-WA0005.jpg",
  "IMG-20250529-WA0006.jpg"

];

/* FOTO OTOMATIS
   WA0001 s/d WA0084
*/
for (let i = 1; i <= 84; i++) {

  const number =
  String(i).padStart(4, "0");

  photos.push(
    `IMG-20250613-WA${number}.jpg`
  );

}

/* TAMPILKAN FOTO */
photos.forEach(photo => {

  const img =
  document.createElement("img");

  img.src = `Galeri/${photo}`;

  img.alt = "Kegiatan";

  /* jika foto tidak ada */
  img.onerror = function () {
    this.style.display = "none";
  };

  gallery.appendChild(img);

});

</script>

</body>
</html>
