<!-- ======================================================
     LOAD FOTO
====================================================== -->

<script>

const gallery =
  document.getElementById(
    "galleryFull"
  );


/* =========================
   ARRAY FOTO
========================= */

const photos = [

  "Gambar 1.jpg",
  "Gambar 2.jpg",
  "Gambar 3.jpg",
  "Gambar 4.jpg",
  "Gambar 5.jpg",

  "IMG-20250510-WA0005.jpg",
  "IMG-20250510-WA0006.jpg",
  "IMG-20250510-WA0007.jpg",

  "IMG-20250528-WA0005.jpg",

  "IMG-20250529-WA0002.jpg",
  "IMG-20250529-WA0004.jpg",
  "IMG-20250529-WA0005.jpg",
  "IMG-20250529-WA0006.jpg"

];


/* =========================
   FOTO OTOMATIS
========================= */

for (
  let i = 1;
  i <= 84;
  i++
) {

  const number =
    String(i).padStart(
      4,
      "0"
    );

  photos.push(
    `IMG-20250613-WA${number}.jpg`
  );

}


/* ======================================================
   SISTEM GANTI FOTO SETIAP 5 HARI
====================================================== */


/*
  TOTAL FOTO TAMPIL:

  10 FOTO
  = 2 BARIS × 5 KOLOM
*/

const jumlahFoto = 10;


/* =========================
   HARI
========================= */

const sekarang =
  new Date();


const totalHari =
  Math.floor(

    sekarang.getTime() /
    (1000 * 60 * 60 * 24)

  );


/* =========================
   PERIODE
========================= */

const periode =
  Math.floor(
    totalHari / 5
  );


/* =========================
   INDEX
========================= */

const startIndex =
  (
    periode *
    jumlahFoto
  )
  %
  photos.length;


/* =========================
   FOTO TAMPIL
========================= */

const tampilFoto = [];


for (
  let i = 0;
  i < jumlahFoto;
  i++
) {

  tampilFoto.push(

    photos[
      (
        startIndex +
        i
      )
      %
      photos.length
    ]

  );

}


/* =========================
   RENDER
========================= */

gallery.innerHTML = "";


tampilFoto.forEach(
  (photo) => {

    const img =
      document.createElement(
        "img"
      );


    img.src =
      `Galeri/${photo}`;


    img.alt =
      "Dokumentasi kegiatan SMP Negeri 20 Konawe Selatan";


    img.loading =
      "lazy";


    img.onerror =
      function() {

        this.style.display =
          "none";

      };


    gallery.appendChild(
      img
    );

  }
);

</script>



<!-- ======================================================
     VIDEO FIREBASE
====================================================== -->

<script type="module">


/* ======================================================
   IMPORT FIREBASE
====================================================== */

import { db }
from "./assets/js/firebase.js";


import {

  collection,
  getDocs,
  query,
  orderBy

}
from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";



/* ======================================================
   ELEMENT
====================================================== */

const videoGrid =
  document.getElementById(
    "videoGrid"
  );



/* ======================================================
   AMBIL YOUTUBE ID
====================================================== */

function getYoutubeId(url) {


  if (!url) {

    return null;

  }


  try {


    const parsed =
      new URL(url);


    const hostname =
      parsed.hostname.toLowerCase();


    const pathname =
      parsed.pathname;



    /* ==================================================
       youtu.be/VIDEO_ID
    ================================================== */

    if (

      hostname ===
        "youtu.be"

      ||

      hostname ===
        "www.youtu.be"

    ) {

      return pathname

        .replace(
          /^\/+/,
          ""
        )

        .split("/")[0]

        .split("?")[0];

    }



    /* ==================================================
       youtube.com/watch?v=VIDEO_ID
    ================================================== */

    if (
      pathname ===
        "/watch"
    ) {

      return parsed
        .searchParams
        .get("v");

    }



    /* ==================================================
       youtube.com/shorts/VIDEO_ID
    ================================================== */

    if (

      pathname.startsWith(
        "/shorts/"
      )

    ) {

      return pathname

        .split("/")[2]

        ?.split("?")[0]

        ?.split("/")[0]

        || null;

    }



    /* ==================================================
       youtube.com/embed/VIDEO_ID
    ================================================== */

    if (

      pathname.startsWith(
        "/embed/"
      )

    ) {

      return pathname

        .split("/")[2]

        ?.split("?")[0]

        ?.split("/")[0]

        || null;

    }



    /* ==================================================
       youtube.com/live/VIDEO_ID
    ================================================== */

    if (

      pathname.startsWith(
        "/live/"
      )

    ) {

      return pathname

        .split("/")[2]

        ?.split("?")[0]

        ?.split("/")[0]

        || null;

    }



    return null;


  } catch (error) {


    console.error(
      "URL YouTube tidak valid:",
      url,
      error
    );


    return null;

  }

}



/* ======================================================
   CONVERT YOUTUBE KE EMBED
====================================================== */

function convertYoutube(url) {


  const youtubeId =
    getYoutubeId(url);


  if (!youtubeId) {

    return url;

  }


  return (

    `https://www.youtube.com/embed/${youtubeId}`

  );

}



/* ======================================================
   THUMBNAIL YOUTUBE
====================================================== */

function getYoutubeThumbnail(url) {


  const youtubeId =
    getYoutubeId(url);


  if (!youtubeId) {

    return "";

  }


  return (

    `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`

  );

}



/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(value) {


  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* ======================================================
   LOAD VIDEO
====================================================== */

async function loadVideo() {


  try {


    /* ==================================================
       QUERY FIRESTORE
    ================================================== */

    const q =
      query(

        collection(
          db,
          "video_sekolah"
        ),

        orderBy(
          "createdAt",
          "desc"
        )

      );


    const snap =
      await getDocs(q);



    /* ==================================================
       JIKA KOSONG
    ================================================== */

    if (
      snap.empty
    ) {


      videoGrid.innerHTML = `

        <div
          class="video-error"
        >

          <i
            class="fa-solid fa-video-slash"
          ></i>

          <p>
            Belum ada video kegiatan.
          </p>

        </div>

      `;


      return;

    }



    /* ==================================================
       SEMUA VIDEO
    ================================================== */

    const semuaVideo = [];


    snap.forEach(
      (docu) => {

        semuaVideo.push(
          docu.data()
        );

      }
    );



    /* ==================================================
       MAKSIMAL 6 VIDEO

       2 BARIS × 3 KOLOM
    ================================================== */

    const jumlahVideo =
      Math.min(
        6,
        semuaVideo.length
      );



    /* ==================================================
       HARI
    ================================================== */

    const sekarang =
      new Date();


    const totalHari =
      Math.floor(

        sekarang.getTime() /
        (
          1000 *
          60 *
          60 *
          24
        )

      );



    /* ==================================================
       PERIODE 5 HARI
    ================================================== */

    const periode =
      Math.floor(
        totalHari / 5
      );



    /* ==================================================
       INDEX VIDEO
    ================================================== */

    const startIndex =
      (
        periode *
        jumlahVideo
      )
      %
      semuaVideo.length;



    /* ==================================================
       VIDEO TAMPIL
    ================================================== */

    const tampilVideo = [];


    for (
      let i = 0;
      i < jumlahVideo;
      i++
    ) {


      tampilVideo.push(

        semuaVideo[
          (
            startIndex +
            i
          )
          %
          semuaVideo.length
        ]

      );

    }



    /* ==================================================
       RENDER
    ================================================== */

    videoGrid.innerHTML = "";


    tampilVideo.forEach(
      (d) => {


        /* ==================================================
           DATA
        ================================================== */

        const judul =
          escapeHtml(
            d.judul ||
            "Video Kegiatan Sekolah"
          );


        const deskripsi =
          escapeHtml(
            d.deskripsi ||
            ""
          );



        /* ==================================================
           YOUTUBE

           Mendukung data lama:

           https://youtube.com/shorts/ID

           https://youtube.com/watch?v=ID

           https://youtu.be/ID

           dan data baru:

           https://www.youtube.com/embed/ID
        ================================================== */

        const youtubeLink =
          convertYoutube(
            d.link
          );



        const youtubeId =
          getYoutubeId(
            d.link
          );



        /*
          Jika Firestore sudah memiliki
          field thumbnail, gunakan itu.

          Jika belum ada, otomatis
          buat dari YouTube ID.
        */

        const thumbnail =
          d.thumbnail ||

          (

            youtubeId

              ?

            getYoutubeThumbnail(
              d.link
            )

              :

            ""

          );



        /* ==================================================
           KARTU VIDEO
        ================================================== */

        videoGrid.innerHTML += `

          <article
            class="video-card"
          >


            <div
              class="video-wrapper"
            >

              <iframe

                src="${youtubeLink}"

                title="${judul}"

                loading="lazy"

                frameborder="0"

                allow="
                  accelerometer;
                  autoplay;
                  clipboard-write;
                  encrypted-media;
                  gyroscope;
                  picture-in-picture;
                  web-share
                "

                referrerpolicy="
                  strict-origin-when-cross-origin
                "

                allowfullscreen

              ></iframe>

            </div>



            <div
              class="video-content"
            >

              <h3>
                ${judul}
              </h3>


              <p>
                ${deskripsi}
              </p>

            </div>


          </article>

        `;

      }

    );


  } catch (error) {


    console.error(
      "Gagal memuat video:",
      error
    );


    videoGrid.innerHTML = `

      <div
        class="video-error"
      >

        <i
          class="
            fa-solid
            fa-circle-exclamation
          "
        ></i>

        <p>
          Video gagal dimuat.
        </p>

      </div>

    `;

  }

}



/* ======================================================
   JALANKAN
====================================================== */

loadVideo();

</script>
