<script>

const gallery =
document.getElementById(
  "galleryFull"
);


/* =====================================================
   ARRAY FOTO
===================================================== */

const photos = [

  "Gambar 1.jpg",
  "Gambar 2.jpg",
  "Gambar 3.jpg",
  "Gambar 4.jpg",
  "Gambar 5.jpg",

  "IMG-20250510-WA0005.jpg",
  "IMG-20250510-WA0006.jpg",
  "IMG-20250510-WA0007.jpg",

  "IMG-20250528-WA0005.jpg",

  "IMG-20250529-WA0002.jpg",
  "IMG-20250529-WA0004.jpg",
  "IMG-20250529-WA0005.jpg",
  "IMG-20250529-WA0006.jpg"

];


/* =====================================================
   FOTO OTOMATIS
===================================================== */

for(let i = 1; i <= 84; i++){

  const number =
    String(i).padStart(4,"0");

  photos.push(
    `IMG-20250613-WA${number}.jpg`
  );

}


/* =====================================================
   JUMLAH FOTO YANG DITAMPILKAN
===================================================== */

/*

   10 FOTO
   2 BARIS × 5 KOLOM

*/

const jumlahFoto = 10;


/* =====================================================
   HITUNG HARI
===================================================== */

const sekarang =
new Date();

const totalHari =
Math.floor(

  sekarang.getTime() /

  (1000 * 60 * 60 * 24)

);


/* =====================================================
   PERIODE 5 HARI
===================================================== */

const periode =
Math.floor(
  totalHari / 5
);


/* =====================================================
   INDEX AWAL
===================================================== */

const startIndex =

(
  periode *
  jumlahFoto
)

% photos.length;


/* =====================================================
   FOTO YANG AKAN DITAMPILKAN
===================================================== */

const tampilFoto = [];


for(
  let i = 0;
  i < jumlahFoto;
  i++
){

  tampilFoto.push(

    photos[

      (
        startIndex +
        i
      )

      %

      photos.length

    ]

  );

}


/* =====================================================
   RENDER FOTO
===================================================== */

gallery.innerHTML = "";


tampilFoto.forEach(
  (photo) => {

    const img =
      document.createElement(
        "img"
      );


    img.src =
      `Galeri/${photo}`;


    img.alt =
      "Kegiatan SMP Negeri 20 Konawe Selatan";


    img.loading =
      "lazy";


    img.onerror =
      function(){

        this.style.display =
          "none";

      };


    gallery.appendChild(
      img
    );

  }
);

</script>

<script type="module">


/* =====================================================
   IMPORT FIREBASE
===================================================== */

import {
  db
}
from "./assets/js/firebase.js";


import {
  collection,
  getDocs,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";



/* =====================================================
   ELEMENT VIDEO
===================================================== */

const videoGrid =
  document.getElementById(
    "videoGrid"
  );



/* =====================================================
   CONVERT YOUTUBE URL
===================================================== */

/*

   FUNGSI INI MENDUKUNG:

   1. YouTube biasa
      https://www.youtube.com/watch?v=ABC123

   2. YouTube pendek
      https://youtu.be/ABC123

   3. YouTube Shorts
      https://youtube.com/shorts/ABC123

   4. URL embed
      https://www.youtube.com/embed/ABC123

*/

function convertYoutube(link){

  /* =================
     LINK KOSONG
  ================= */

  if(!link){

    return "";

  }


  try{

    const url =
      new URL(link);


    let videoId =
      "";


    /* =================================================
       YOUTUBE SHORTS
    ================================================= */

    if(
      url.pathname.startsWith(
        "/shorts/"
      )
    ){

      videoId =

        url.pathname

        .split(
          "/shorts/"
        )[1]

        .split(
          "/"
        )[0];

    }


    /* =================================================
       YOUTUBE WATCH
    ================================================= */

    else if(
      url.searchParams.has("v")
    ){

      videoId =
        url.searchParams.get("v");

    }


    /* =================================================
       YOUTU.BE
    ================================================= */

    else if(
      url.hostname ===
      "youtu.be"
    ){

      videoId =

        url.pathname

        .replace(
          "/",
          ""
        )

        .split(
          "/"
        )[0];

    }


    /* =================================================
       YOUTUBE EMBED
    ================================================= */

    else if(
      url.pathname.startsWith(
        "/embed/"
      )
    ){

      videoId =

        url.pathname

        .split(
          "/embed/"
        )[1]

        .split(
          "/"
        )[0];

    }


    /* =================================================
       HASIL
    ================================================= */

    if(videoId){

      return `https://www.youtube.com/embed/${videoId}`;

    }

  }

  catch(error){

    console.error(
      "URL YouTube tidak valid:",
      link
    );

  }


  return "";

}



/* =====================================================
   LOAD VIDEO DARI FIREBASE
===================================================== */

async function loadVideo(){

  try{


    /* =================================================
       QUERY FIRESTORE
    ================================================= */

    const q =
      query(

        collection(
          db,
          "video_sekolah"
        ),

        orderBy(
          "createdAt",
          "desc"
        )

      );


    /* =================================================
       AMBIL DATA
    ================================================= */

    const snap =
      await getDocs(q);



    /* =================================================
       JIKA KOSONG
    ================================================= */

    if(
      snap.empty
    ){

      videoGrid.innerHTML = `

        <div class="video-error">

          <i
            class="fa-solid fa-video-slash">
          </i>

          <p>
            Belum ada video kegiatan
          </p>

        </div>

      `;

      return;

    }



    /* =================================================
       SEMUA VIDEO
    ================================================= */

    const semuaVideo = [];


    snap.forEach(
      (docu) => {

        semuaVideo.push(
          docu.data()
        );

      }
    );



    /* =================================================
       JUMLAH VIDEO
    ================================================= */

    /*

       Maksimal 6 video

       2 BARIS × 3 KOLOM

    */

    const jumlahVideo =

      Math.min(
        6,
        semuaVideo.length
      );



    /* =================================================
       HITUNG HARI
    ================================================= */

    const sekarang =
      new Date();


    const totalHari =

      Math.floor(

        sekarang.getTime() /

        (1000 * 60 * 60 * 24)

      );



    /* =================================================
       PERIODE 5 HARI
    ================================================= */

    const periode =

      Math.floor(
        totalHari / 5
      );



    /* =================================================
       INDEX VIDEO
    ================================================= */

    const startIndex =

      (
        periode *
        jumlahVideo
      )

      %

      semuaVideo.length;



    /* =================================================
       VIDEO YANG DITAMPILKAN
    ================================================= */

    const tampilVideo = [];


    for(

      let i = 0;

      i < jumlahVideo;

      i++

    ){

      tampilVideo.push(

        semuaVideo[

          (
            startIndex +
            i
          )

          %

          semuaVideo.length

        ]

      );

    }



    /* =================================================
       RENDER VIDEO
    ================================================= */

    videoGrid.innerHTML = "";



    tampilVideo.forEach(
      (d) => {


        /* =============================================
           LINK YOUTUBE
        ============================================= */

        const youtubeLink =
          convertYoutube(
            d.link
          );



        /* =============================================
           JIKA LINK TIDAK VALID
        ============================================= */

        if(!youtubeLink){

          return;

        }



        /* =============================================
           JUDUL
        ============================================= */

        const judul =
          d.judul ||
          "Video Kegiatan Sekolah";



        /* =============================================
           DESKRIPSI
        ============================================= */

        const deskripsi =
          d.deskripsi ||
          "";



        /* =============================================
           CREATE CARD
        ============================================= */

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "video-card";



        /* =============================================
           VIDEO CARD
        ============================================= */

        card.innerHTML = `

          <div class="video-wrapper">

            <iframe

              src="${youtubeLink}"

              title="${judul}"

              loading="lazy"

              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share
              "

              allowfullscreen>

            </iframe>

          </div>


          <div class="video-content">

            <h3>
              ${judul}
            </h3>

            <p>
              ${deskripsi}
            </p>

          </div>

        `;



        /* =============================================
           MASUKKAN KE GRID
        ============================================= */

        videoGrid.appendChild(
          card
        );

      }
    );



    /* =================================================
       JIKA SEMUA LINK INVALID
    ================================================= */

    if(
      videoGrid.children.length === 0
    ){

      videoGrid.innerHTML = `

        <div class="video-error">

          <i
            class="fa-solid fa-circle-exclamation">
          </i>

          <p>
            Link video tidak valid
          </p>

        </div>

      `;

    }


  }

  catch(err){

    console.error(
      "Gagal memuat video:",
      err
    );


    videoGrid.innerHTML = `

      <div class="video-error">

        <i
          class="fa-solid fa-circle-exclamation">
        </i>

        <p>
          Video gagal dimuat
        </p>

      </div>

    `;

  }

}



/* =====================================================
   JALANKAN
===================================================== */

loadVideo();

</script>


</body>
