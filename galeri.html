<!-- ================= LOAD FOTO ================= -->

<script>
const gallery =
document.getElementById(
  "galleryFull"
);

/* ================= ARRAY FOTO ================= */

const photos = [

  "Gambar 1.jpg",
  "Gambar 2.jpg",
  "Gambar 3.jpg",
  "Gambar 4.jpg",
  "Gambar 5.jpg",

  "IMG-20250510-WA0005.jpg",
  "IMG-20250510-WA0006.jpg",
  "IMG-20250510-WA0007.jpg",

  "IMG-20250528-WA0005.jpg",

  "IMG-20250529-WA0002.jpg",
  "IMG-20250529-WA0004.jpg",
  "IMG-20250529-WA0005.jpg",
  "IMG-20250529-WA0006.jpg"

];

/* ================= FOTO OTOMATIS ================= */

for(let i = 1; i <= 84; i++){

  const number =
  String(i).padStart(4,"0");

  photos.push(
    `IMG-20250613-WA${number}.jpg`
  );

}

/* ======================================================
   SISTEM GANTI FOTO SETIAP 5 HARI
====================================================== */

/*
  TOTAL FOTO TAMPIL:
  10 FOTO
  = 2 BARIS × 5 KOLOM
*/

const jumlahFoto = 10;

/* ================= HARI ================= */

const sekarang =
new Date();

const totalHari =
Math.floor(

  sekarang.getTime() /

  (1000 * 60 * 60 * 24)

);

/* ================= PERIODE ================= */

const periode =
Math.floor(totalHari / 5);

/* ================= INDEX ================= */

const startIndex =

(periode * jumlahFoto)

% photos.length;

/* ================= FOTO TAMPIL ================= */

const tampilFoto = [];

for(let i = 0; i < jumlahFoto; i++){

  tampilFoto.push(

    photos[
      (startIndex + i)
      % photos.length
    ]

  );

}

/* ================= RENDER ================= */

gallery.innerHTML = "";

tampilFoto.forEach((photo)=>{

  const img =
  document.createElement("img");

  img.src =
  `Galeri/${photo}`;

  img.alt =
  "Kegiatan Sekolah";

  img.loading =
  "lazy";

  img.onerror = function(){

    this.style.display =
    "none";

  };

  gallery.appendChild(img);

});

</script>

<!-- ================= VIDEO FIREBASE ================= -->
<script type="module">

/* ======================================================
   VIDEO 2 BARIS 3 KOLOM
   BERGANTI SETIAP 5 HARI
====================================================== */

/* ================= IMPORT ================= */

import { db }
from "./assets/js/firebase.js";

import {
  collection,
  getDocs,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ================= ELEMENT ================= */

const videoGrid =
document.getElementById(
  "videoGrid"
);

/* ================= CONVERT YOUTUBE ================= */

function convertYoutube(link){

  if(link.includes("watch?v=")){

    return link.replace(
      "watch?v=",
      "embed/"
    );

  }

  if(link.includes("youtu.be/")){

    return link.replace(
      "youtu.be/",
      "www.youtube.com/embed/"
    );

  }

  return link;
}

/* ================= LOAD VIDEO ================= */

async function loadVideo(){

  try{

const q = query(

  collection(db,"video_sekolah"),

  orderBy("createdAt","desc")

);

    const snap =
    await getDocs(q);

    /* ================= KOSONG ================= */

    if(snap.empty){

      videoGrid.innerHTML = `

        <div class="video-error">

          <i class="fa-solid fa-video-slash"></i>

          <p>
            Belum ada video kegiatan
          </p>

        </div>

      `;

      return;
    }

    /* ================= SEMUA VIDEO ================= */

    const semuaVideo = [];

    snap.forEach((docu)=>{

      semuaVideo.push(
        docu.data()
      );

    });

    /*
      TOTAL VIDEO:
      6 VIDEO
      = 2 BARIS × 3 KOLOM
    */

    const jumlahVideo =
Math.min(6, semuaVideo.length);

    /* ================= HARI ================= */

    const sekarang =
    new Date();

    const totalHari =
    Math.floor(

      sekarang.getTime() /

      (1000 * 60 * 60 * 24)

    );

    /* ================= PERIODE ================= */

    const periode =
    Math.floor(totalHari / 5);

    /* ================= INDEX ================= */

    const startIndex =

    (periode * jumlahVideo)

    % semuaVideo.length;

    /* ================= VIDEO TAMPIL ================= */

    const tampilVideo = [];

    for(let i = 0; i < jumlahVideo; i++){

      tampilVideo.push(

        semuaVideo[
          (startIndex + i)
          % semuaVideo.length
        ]

      );

    }

    /* ================= RENDER ================= */

    videoGrid.innerHTML = "";

    tampilVideo.forEach((d)=>{

      const youtubeLink =
      convertYoutube(d.link);

      videoGrid.innerHTML += `

        <div class="video-card">

          <div class="video-wrapper">

            <iframe
              src="${youtubeLink}"
              title="${d.judul}"
              allowfullscreen>
            </iframe>

          </div>

          <div class="video-content">

            <h3>
              ${d.judul || "-"}
            </h3>

            <p>
              ${d.deskripsi || ""}
            </p>

          </div>

        </div>

      `;

    });

  }catch(err){

    console.log(err);

    videoGrid.innerHTML = `

      <div class="video-error">

        <i class="fa-solid fa-circle-exclamation"></i>

        <p>
          Video gagal dimuat
        </p>

      </div>

    `;
  }
}

/* ================= RUN ================= */

loadVideo();

</script>
