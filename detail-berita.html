<!-- ================= SCRIPT ================= -->

<script type="module" src="assets/js/include.js"></script>
<script type="module">

import { db }
from "./assets/js/firebase.js";

import {

  doc,
  getDoc,

  addDoc,
  collection,

  query,
  where,

  onSnapshot,
  serverTimestamp,

  getDocs,
  orderBy,
  limit

}
from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* =========================
   URL PARAM
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const id =
params.get("id");

/* =========================
   VALIDASI ID
========================= */

if(!id){

  document.body.innerHTML = `
    <div style="padding:100px;text-align:center;font-family:Arial;">
      <h1>ID berita tidak ditemukan</h1>
    </div>
  `;

  throw new Error("ID tidak ditemukan");

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

  if(!text) return "";

  return text
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

/* =========================
   FORMAT TANGGAL
========================= */

function formatTanggalIndonesia(tanggalInput){

  if(!tanggalInput) return "-";

  try{

    if(tanggalInput.seconds){
      tanggalInput = new Date(tanggalInput.seconds * 1000);
    }else{
      tanggalInput = new Date(tanggalInput);
    }

    return tanggalInput.toLocaleDateString("id-ID",{
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    });

  }catch{
    return "-";
  }

}

/* =========================
   LOAD BERITA
========================= */

async function loadBerita(){

  try{

    const beritaRef = doc(db,"berita",id);
    const beritaSnap = await getDoc(beritaRef);

    if(beritaSnap.exists()){
      tampilBerita(beritaSnap.data());
    }else{
      document.body.innerHTML = `
        <div style="padding:100px;text-align:center;font-family:Arial;">
          <h1>Berita tidak ditemukan</h1>
        </div>
      `;
    }

  }catch(error){
    console.log(error);
  }

}

/* =========================
   TAMPIL BERITA (FIX ISI)
========================= */
function tampilBerita(data){

  document.getElementById("judulBerita").textContent =
  data.judul || "-";

  document.getElementById("metaBerita").innerHTML = `
    ${formatTanggalIndonesia(data.tanggal)}
    &nbsp; • &nbsp;
    ${escapeHtml(data.penulis || "-")}
  `;

  const gambarHero =
  document.getElementById("gambarBerita");

  gambarHero.src =
  data.gambar1 ||
  "https://via.placeholder.com/1000x700?text=Berita";

  gambarHero.onerror = function(){
    this.src = "https://via.placeholder.com/1000x700?text=Berita";
  };

  let isiHtml = "";

  /* =========================
     ARRAY
  ========================= */

  if(Array.isArray(data.isi)){

    data.isi.forEach((item,index)=>{

      isiHtml += `
        <p>${escapeHtml(item)}</p>
      `;

      if(index === 2 && data.gambar2){

        isiHtml += `
          <img
            src="${data.gambar2}"
            class="gambar-tengah"
            loading="lazy"
            onerror="this.style.display='none'"
          >
        `;

      }

    });

  }

  /* =========================
     STRING
  ========================= */

  else{

    isiHtml += `
      <p>${escapeHtml(data.isi || "")}</p>
    `;

    if(data.gambar2){

      isiHtml += `
        <img
          src="${data.gambar2}"
          class="gambar-tengah"
          loading="lazy"
          onerror="this.style.display='none'"
        >
      `;

    }

  }

  document.getElementById("isiBerita").innerHTML =
  isiHtml;

}
/* =========================
   KIRIM KOMENTAR
========================= */

const btnKirim =
document.getElementById("btnKirim");

btnKirim.addEventListener("click", async () => {

  const nama =
  document.getElementById("nama").value.trim();

  const email =
  document.getElementById("email").value.trim();

  const pesan =
  document.getElementById("pesan").value.trim();

  if(!nama || !email || !pesan){
    alert("Lengkapi semua data");
    return;
  }

  try{

    btnKirim.disabled = true;
    btnKirim.innerHTML = "Mengirim...";

    await addDoc(
      collection(db,"komentar"),
      {
        beritaId:id,
        nama,
        email,
        pesan,
        createdAt: serverTimestamp()
      }
    );

    alert("Komentar berhasil dikirim");

    document.getElementById("nama").value = "";
    document.getElementById("email").value = "";
    document.getElementById("pesan").value = "";

  }catch(error){
    console.log(error);
    alert("Gagal mengirim komentar");
  }

  btnKirim.disabled = false;
  btnKirim.innerHTML = "Kirim Komentar";

});

/* =========================
   TAMPIL KOMENTAR (ANTI ERROR FIX)
========================= */

function tampilKomentar(){

  const listKomentar =
  document.getElementById("listKomentar");

  listKomentar.innerHTML = "<p>Memuat komentar...</p>";

  const q = query(
    collection(db,"komentar"),
    where("beritaId","==",id)
  );

  onSnapshot(q, (snapshot) => {

    listKomentar.innerHTML = "";

    if(snapshot.empty){
      listKomentar.innerHTML = "<p>Belum ada komentar</p>";
      return;
    }

    const list = [];

    snapshot.forEach(doc => {
      list.push(doc.data());
    });

    // urutkan manual (biar tidak perlu orderBy index)
    list.sort((a,b)=>{
      return (b.createdAt?.seconds || 0)
           - (a.createdAt?.seconds || 0);
    });

    list.forEach(data => {

      let waktu = "Baru saja";

      if(data.createdAt?.seconds){
        waktu = new Date(
          data.createdAt.seconds * 1000
        ).toLocaleString("id-ID");
      }

      listKomentar.innerHTML += `
        <div class="komentar-item">

          <div class="komentar-top">
            <h5>${escapeHtml(data.nama)}</h5>
            <span>${waktu}</span>
          </div>

          <p>${escapeHtml(data.pesan)}</p>

        </div>
      `;

    });

  }, (error) => {

    console.log(error);

    listKomentar.innerHTML = `
      <p style="color:red;">
        Gagal memuat komentar
      </p>
    `;

  });

}

async function loadPopularPost(){

  const container =
  document.getElementById("popularPost");

  if(!container) return;

  try{

    const q = query(
      collection(db,"berita"),
      orderBy("tanggal","desc")
    );

    const snapshot =
    await getDocs(q);

    let berita = [];

    snapshot.forEach(docSnap=>{

      if(docSnap.id !== id){

        berita.push({
          id: docSnap.id,
          ...docSnap.data()
        });

      }

    });

    if(berita.length === 0){

      container.innerHTML =
      "<p>Belum ada berita.</p>";

      return;

    }

    // indeks berubah setiap hari
    const hari =
    Math.floor(Date.now() / 86400000);

    let html = "";

    for(let i=0;i<3;i++){

      const item =
      berita[(hari + i) % berita.length];

      html += `

      <a href="detail-berita.html?id=${item.id}"
         class="popular-post">

        <img
          src="${item.gambar1 || 'https://via.placeholder.com/150'}"
          alt="${escapeHtml(item.judul)}"
          loading="lazy"
        >

        <div>
          <h4>${escapeHtml(item.judul)}</h4>

          <span>
            ${formatTanggalIndonesia(item.tanggal)}
          </span>
        </div>

      </a>

      `;

    }

    container.innerHTML = html;

  }catch(error){

    console.log(error);

    container.innerHTML =
    "<p>Gagal memuat berita.</p>";

  }

}

/* =========================
   START
========================= */
loadBerita();
tampilKomentar();
loadPopularPost();

</script>

</body>
