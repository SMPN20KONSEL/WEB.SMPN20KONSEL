<script type="module">

import { db }
from "./assets/js/firebase.js";

import {

  doc,
  getDoc,

  addDoc,
  collection,

  query,
  where,

  onSnapshot,
  serverTimestamp,

  getDocs,
  orderBy

}
from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


/* =====================================================
   URL PARAMETER
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const id =
  params.get("id");


/* =====================================================
   BASE URL
===================================================== */

const BASE_URL =
  "https://smpn20konsel.github.io/WEB.SMPN20KONSEL/";


/* =====================================================
   VALIDASI ID
===================================================== */

if(!id){

  document.body.innerHTML = `

    <div
      style="
        padding:100px 20px;
        text-align:center;
        font-family:Arial;
      "
    >

      <h1>
        ID berita tidak ditemukan
      </h1>

      <p>
        Silakan kembali ke halaman berita.
      </p>

      <a href="${BASE_URL}berita.html">
        Kembali ke Berita
      </a>

    </div>

  `;

  throw new Error("ID berita tidak ditemukan");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

  if(text === undefined || text === null){
    return "";
  }

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggalIndonesia(tanggalInput){

  if(!tanggalInput){
    return "-";
  }

  try{

    if(
      typeof tanggalInput === "object" &&
      tanggalInput.seconds
    ){

      tanggalInput =
        new Date(
          tanggalInput.seconds * 1000
        );

    }else{

      tanggalInput =
        new Date(tanggalInput);

    }

    if(isNaN(tanggalInput.getTime())){
      return "-";
    }

    return tanggalInput.toLocaleDateString(
      "id-ID",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  }catch{

    return "-";

  }

}


/* =====================================================
   GET DATE ISO
===================================================== */

function getDateISO(tanggalInput){

  try{

    let tanggal;

    if(
      typeof tanggalInput === "object" &&
      tanggalInput?.seconds
    ){

      tanggal =
        new Date(
          tanggalInput.seconds * 1000
        );

    }else{

      tanggal =
        new Date(tanggalInput);

    }

    if(isNaN(tanggal.getTime())){
      return new Date().toISOString();
    }

    return tanggal.toISOString();

  }catch{

    return new Date().toISOString();

  }

}


/* =====================================================
   BUAT DESKRIPSI DARI ISI
===================================================== */

function buatDeskripsi(data){

  let teks = "";

  if(Array.isArray(data.isi)){

    teks =
      data.isi
        .join(" ")
        .replace(/\s+/g," ")
        .trim();

  }else{

    teks =
      String(data.isi || "")
        .replace(/<[^>]*>/g," ")
        .replace(/\s+/g," ")
        .trim();

  }

  if(!teks){

    teks =
      `Berita terbaru SMP Negeri 20 Konawe Selatan tentang ${data.judul || "kegiatan sekolah"}.`;

  }

  if(teks.length > 160){

    teks =
      teks.substring(0,157).trim() + "...";

  }

  return teks;

}


/* =====================================================
   UPDATE SEO
===================================================== */

function updateSEO(data){

  const judul =
    String(
      data.judul ||
      "Berita Sekolah"
    ).trim();

  const deskripsi =
    buatDeskripsi(data);

  const gambar =
    data.gambar1 ||
    `${BASE_URL}image/Logo_transparent.png`;

  const url =
    `${BASE_URL}detail-berita.html?id=${encodeURIComponent(id)}`;

  const tanggalISO =
    getDateISO(data.tanggal);

  const penulis =
    String(
      data.penulis ||
      "SMP Negeri 20 Konawe Selatan"
    ).trim();


  /* ===================================================
     TITLE
  =================================================== */

  document.title =
    `${judul} | SMP Negeri 20 Konawe Selatan`;


  const pageTitle =
    document.getElementById("pageTitle");

  if(pageTitle){

    pageTitle.textContent =
      `${judul} | SMP Negeri 20 Konawe Selatan`;

  }


  /* ===================================================
     DESCRIPTION
  =================================================== */

  document
    .getElementById("metaDescription")
    ?.setAttribute(
      "content",
      deskripsi
    );


  /* ===================================================
     CANONICAL
  =================================================== */

  document
    .getElementById("canonicalUrl")
    ?.setAttribute(
      "href",
      url
    );


  /* ===================================================
     OPEN GRAPH
  =================================================== */

  document
    .getElementById("ogTitle")
    ?.setAttribute(
      "content",
      judul
    );

  document
    .getElementById("ogDescription")
    ?.setAttribute(
      "content",
      deskripsi
    );

  document
    .getElementById("ogUrl")
    ?.setAttribute(
      "content",
      url
    );

  document
    .getElementById("ogImage")
    ?.setAttribute(
      "content",
      gambar
    );


  /* ===================================================
     TWITTER
  =================================================== */

  document
    .getElementById("twitterTitle")
    ?.setAttribute(
      "content",
      judul
    );

  document
    .getElementById("twitterDescription")
    ?.setAttribute(
      "content",
      deskripsi
    );

  document
    .getElementById("twitterImage")
    ?.setAttribute(
      "content",
      gambar
    );


  /* ===================================================
     NEWSARTICLE SCHEMA
  =================================================== */

  const schema = {

    "@context":
      "https://schema.org",

    "@type":
      "NewsArticle",

    "headline":
      judul,

    "description":
      deskripsi,

    "datePublished":
      tanggalISO,

    "dateModified":
      tanggalISO,

    "mainEntityOfPage":{

      "@type":
        "WebPage",

      "@id":
        url

    },

    "author":{

      "@type":
        "Person",

      "name":
        penulis

    },

    "publisher":{

      "@type":
        "Organization",

      "name":
        "SMP Negeri 20 Konawe Selatan",

      "logo":{

        "@type":
          "ImageObject",

        "url":
          `${BASE_URL}image/Logo_transparent.png`

      }

    },

    "image":[
      gambar
    ]

  };


  document
    .getElementById("newsSchema")
    .textContent =
      JSON.stringify(
        schema,
        null,
        2
      );

}


/* =====================================================
   LOAD BERITA
===================================================== */

async function loadBerita(){

  try{

    const beritaRef =
      doc(
        db,
        "berita",
        id
      );

    const beritaSnap =
      await getDoc(
        beritaRef
      );


    if(!beritaSnap.exists()){

      document.body.innerHTML = `

        <div
          style="
            padding:100px 20px;
            text-align:center;
            font-family:Arial;
          "
        >

          <h1>
            Berita tidak ditemukan
          </h1>

          <p>
            Berita yang kamu cari tidak tersedia.
          </p>

          <a href="${BASE_URL}berita.html">
            Kembali ke Berita
          </a>

        </div>

      `;

      return;

    }


    const data =
      beritaSnap.data();


    /* UPDATE SEO */
    updateSEO(data);


    /* TAMPILKAN BERITA */
    tampilBerita(data);


  }catch(error){

    console.error(
      "Gagal memuat berita:",
      error
    );

  }

}


/* =====================================================
   TAMPIL BERITA
===================================================== */

function tampilBerita(data){

  /* JUDUL */

  document
    .getElementById("judulBerita")
    .textContent =
      data.judul || "-";


  /* META */

  document
    .getElementById("metaBerita")
    .innerHTML = `

      <i class="fas fa-calendar-alt"></i>

      ${formatTanggalIndonesia(data.tanggal)}

      &nbsp; • &nbsp;

      <i class="fas fa-user"></i>

      ${escapeHtml(
        data.penulis ||
        "SMP Negeri 20 Konawe Selatan"
      )}

      ${
        data.kategori
        ? `
          &nbsp; • &nbsp;

          <i class="fas fa-folder"></i>

          ${escapeHtml(data.kategori)}
        `
        : ""
      }

    `;


  /* GAMBAR UTAMA */

  const gambarHero =
    document.getElementById(
      "gambarBerita"
    );


  const gambarDefault =
    "image/Logo_transparent.png";


  gambarHero.src =
    data.gambar1 ||
    gambarDefault;


  gambarHero.alt =
    data.judul ||
    "Berita SMP Negeri 20 Konawe Selatan";


  gambarHero.onerror =
    function(){

      this.src =
        gambarDefault;

    };


  /* ISI */

  let isiHtml = "";


  if(Array.isArray(data.isi)){

    data.isi.forEach(
      (item,index)=>{

        if(item){

          isiHtml += `

            <p>
              ${escapeHtml(item)}
            </p>

          `;

        }


        if(
          index === 2 &&
          data.gambar2
        ){

          isiHtml += `

            <figure>

              <img
                src="${escapeHtml(data.gambar2)}"
                class="gambar-tengah"
                loading="lazy"
                alt="${escapeHtml(data.judul || "Dokumentasi berita")}"
                onerror="this.parentElement.style.display='none'"
              >

              <figcaption>
                Dokumentasi kegiatan
                SMP Negeri 20 Konawe Selatan
              </figcaption>

            </figure>

          `;

        }

      }
    );

  }else{

    if(data.isi){

      isiHtml += `

        <p>
          ${escapeHtml(data.isi)}
        </p>

      `;

    }


    if(data.gambar2){

      isiHtml += `

        <figure>

          <img
            src="${escapeHtml(data.gambar2)}"
            class="gambar-tengah"
            loading="lazy"
            alt="${escapeHtml(data.judul || "Dokumentasi berita")}"
            onerror="this.parentElement.style.display='none'"
          >

          <figcaption>
            Dokumentasi kegiatan
            SMP Negeri 20 Konawe Selatan
          </figcaption>

        </figure>

      `;

    }

  }


  if(!isiHtml){

    isiHtml =
      "<p>Isi berita belum tersedia.</p>";

  }


  document
    .getElementById("isiBerita")
    .innerHTML =
      isiHtml;

}


/* =====================================================
   KIRIM KOMENTAR
===================================================== */

const btnKirim =
  document.getElementById(
    "btnKirim"
  );


btnKirim.addEventListener(
  "click",
  async ()=>{

    const nama =
      document
        .getElementById("nama")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const pesan =
      document
        .getElementById("pesan")
        .value
        .trim();


    if(
      !nama ||
      !email ||
      !pesan
    ){

      alert(
        "Lengkapi semua data"
      );

      return;

    }


    try{

      btnKirim.disabled =
        true;

      btnKirim.innerHTML =
        "Mengirim...";


      await addDoc(

        collection(
          db,
          "komentar"
        ),

        {

          beritaId:id,

          nama,

          email,

          pesan,

          createdAt:
            serverTimestamp()

        }

      );


      alert(
        "Komentar berhasil dikirim"
      );


      document
        .getElementById("nama")
        .value = "";


      document
        .getElementById("email")
        .value = "";


      document
        .getElementById("pesan")
        .value = "";


    }catch(error){

      console.error(error);

      alert(
        "Gagal mengirim komentar"
      );

    }


    btnKirim.disabled =
      false;

    btnKirim.innerHTML =
      "Kirim Komentar";

  }
);


/* =====================================================
   TAMPIL KOMENTAR
===================================================== */

function tampilKomentar(){

  const listKomentar =
    document.getElementById(
      "listKomentar"
    );


  listKomentar.innerHTML =
    "<p>Memuat komentar...</p>";


  const q =
    query(

      collection(
        db,
        "komentar"
      ),

      where(
        "beritaId",
        "==",
        id
      )

    );


  onSnapshot(
    q,

    snapshot=>{

      listKomentar.innerHTML =
        "";


      if(snapshot.empty){

        listKomentar.innerHTML =
          "<p>Belum ada komentar</p>";

        return;

      }


      const list = [];


      snapshot.forEach(
        docSnap=>{

          list.push(
            docSnap.data()
          );

        }
      );


      list.sort(
        (a,b)=>{

          return (
            b.createdAt?.seconds || 0
          ) -
          (
            a.createdAt?.seconds || 0
          );

        }
      );


      list.forEach(
        data=>{

          let waktu =
            "Baru saja";


          if(
            data.createdAt?.seconds
          ){

            waktu =
              new Date(
                data.createdAt.seconds * 1000
              ).toLocaleString(
                "id-ID"
              );

          }


          listKomentar.innerHTML += `

            <div class="komentar-item">

              <div class="komentar-top">

                <h5>
                  ${escapeHtml(data.nama)}
                </h5>

                <span>
                  ${escapeHtml(waktu)}
                </span>

              </div>

              <p>
                ${escapeHtml(data.pesan)}
              </p>

            </div>

          `;

        }
      );

    },

    error=>{

      console.error(error);

      listKomentar.innerHTML = `

        <p style="color:red;">
          Gagal memuat komentar
        </p>

      `;

    }

  );

}


/* =====================================================
   POPULAR POST
===================================================== */

async function loadPopularPost(){

  const container =
    document.getElementById(
      "popularPost"
    );


  if(!container){
    return;
  }


  try{

    const q =
      query(

        collection(
          db,
          "berita"
        ),

        orderBy(
          "tanggal",
          "desc"
        )

      );


    const snapshot =
      await getDocs(q);


    const berita = [];


    snapshot.forEach(
      docSnap=>{

        if(docSnap.id !== id){

          berita.push({

            id:
              docSnap.id,

            ...docSnap.data()

          });

        }

      }
    );


    if(
      berita.length === 0
    ){

      container.innerHTML =
        "<p>Belum ada berita.</p>";

      return;

    }


    const hari =
      Math.floor(
        Date.now() /
        86400000
      );


    let html = "";


    const jumlah =
      Math.min(
        3,
        berita.length
      );


    for(
      let i=0;
      i<jumlah;
      i++
    ){

      const item =
        berita[
          (hari + i) %
          berita.length
        ];


      html += `

        <a
          href="detail-berita.html?id=${encodeURIComponent(item.id)}"
          class="popular-post"
        >

          <img
            src="${escapeHtml(item.gambar1 || "image/Logo_transparent.png")}"
            alt="${escapeHtml(item.judul || "Berita sekolah")}"
            loading="lazy"
            onerror="this.src='image/Logo_transparent.png'"
          >

          <div>

            <h4>
              ${escapeHtml(item.judul || "-")}
            </h4>

            <span>
              ${formatTanggalIndonesia(item.tanggal)}
            </span>

          </div>

        </a>

      `;

    }


    container.innerHTML =
      html;


  }catch(error){

    console.error(error);

    container.innerHTML =
      "<p>Gagal memuat berita.</p>";

  }

}


/* =====================================================
   START
===================================================== */

loadBerita();

tampilKomentar();

loadPopularPost();

</script>
