<!-- ================= FIREBASE ================= -->
<script type="module">

import { db } from "../assets/js/firebase.js";

import {
  collection,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ================= LOAD DATA ================= */

onSnapshot(collection(db,"siswa"), (snap)=>{

  let kelompokKelas = {};

  /* ================= KELOMPOKKAN SISWA ================= */

  snap.forEach((d)=>{

    const s = d.data();

    const kelas = s.kelas || "Tanpa Kelas";

    if(!kelompokKelas[kelas]){

      kelompokKelas[kelas] = [];

    }

    kelompokKelas[kelas].push(s);

  });

  /* ================= TAMPILKAN ================= */

  let semuaHTML = "";

  Object.keys(kelompokKelas).forEach((kelas)=>{

    semuaHTML += `

<section class="card"
style="
margin-bottom:30px;
padding:20px;
">

<h2
style="
margin-bottom:20px;
color:#111827;
border-left:5px solid #2563eb;
padding-left:10px;
">

KELAS ${kelas}

</h2>

<div class="container">

`;

    /* ================= SISWA ================= */

    kelompokKelas[kelas].forEach((s)=>{

      semuaHTML += `

<div class="card">

  <div class="profil">

    <img
      class="foto"
      src="../image/siswa/${s.nis}.jpg"

      onerror="this.onerror=null;
      this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png';">

    <div class="info">

      <h3>${s.nama || "-"}</h3>

      <p>
        <span class="label">Kelas :</span>
        ${s.kelas || "-"}
      </p>

      <p>
        <span class="label">Agama :</span>
        ${s.agama || "-"}
      </p>

      <p>
        <span class="label">Gender :</span>
        ${s.jk || "-"}
      </p>

      <p>
        <span class="label">NIS :</span>
        ${s.nis || "-"}
      </p>

    </div>

  </div>

</div>

`;

    });

    semuaHTML += `
</div>
</section>
`;

  });

  document.getElementById("semuaKelas").innerHTML =
  semuaHTML || "Tidak ada data siswa";

});

</script>
