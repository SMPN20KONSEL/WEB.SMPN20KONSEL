<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Siswa | SMP Negeri 20 Konawe Selatan</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/header-footer.css">
  <link rel="stylesheet" href="assets/css/datasiswa.css">

</head>

<body>

<div id="header"></div>
<!-- =========================
     HERO
========================= -->

<!-- ================= HERO ================= -->
<section class="hero">

  <div class="hero-content">

    <h1>
      Profil <span>Siswa</span>
    </h1>

    <p>
      Data peserta didik SMP Negeri 20 Konawe Selatan
    </p>

    <div class="hero-btn">
      <a href="#siswa">
        Lihat Siswa
      </a>
    </div>

  </div>

</section>


<!-- ================= STATISTICS ================= -->
<section class="container stats-dashboard">

  <!-- SISWA -->
  <div class="stats-card stats-left">

    <div class="stat-main">
      <h4><i class="fas fa-user-graduate"></i> Total Siswa Aktif</h4>
      <h2 id="totalSiswa">0</h2>
    </div>

    <div class="stat-row">

      <div class="stat-mini">
        <h4><i class="fas fa-male"></i> Laki-laki</h4>
        <h2 id="siswaL">0</h2>
      </div>

      <div class="stat-mini">
        <h4><i class="fas fa-female"></i> Perempuan</h4>
        <h2 id="siswaP">0</h2>
      </div>

    </div>

  </div>

  <!-- ALUMNI -->
  <div class="stats-card stats-right">

    <div class="stat-main">
      <h4><i class="fas fa-user-check"></i> Total Alumni</h4>
      <h2 id="totalAlumni">0</h2>
    </div>

    <div class="stat-row">

      <div class="stat-mini">
        <h4><i class="fas fa-male"></i> Alumni Laki-laki</h4>
        <h2 id="alumniL">0</h2>
      </div>

      <div class="stat-mini">
        <h4><i class="fas fa-female"></i> Alumni Perempuan</h4>
        <h2 id="alumniP">0</h2>
      </div>

    </div>

  </div>

</section>


<!-- ================= FILTER ================= -->
<section class="container filter-section">

  <div class="filter-card">

    <!-- FILTER SISWA -->
    <div class="filter-item">

      <label class="filter-label">
        <i class="fas fa-user-graduate"></i>
        Siswa Aktif
      </label>

      <select id="filterKelas" class="filter-select">
        <option value="">Semua Kelas</option>
      </select>

    </div>

    <!-- FILTER ALUMNI -->
    <div class="filter-item">

      <label class="filter-label">
        <i class="fas fa-user-check"></i>
        Alumni
      </label>

      <select id="filterTahun" class="filter-select">
        <option value="">Semua Tahun Lulus</option>
      </select>

    </div>

  </div>

</section>


<!-- ================= SISWA ================= -->
<section id="siswa" class="container">

  <div class="section-title">
    <h2><i class="fas fa-users"></i> Siswa Aktif</h2>
  </div>

  <div id="dataSiswa" class="siswa-grid"></div>

</section>


<!-- ================= ALUMNI ================= -->
<section class="container alumni-section">

  <div class="section-title">
    <h2><i class="fas fa-user-check"></i> Alumni</h2>
  </div>

  <div id="dataAlumni" class="siswa-grid"></div>

</section>

<div id="footer"></div>

<script type="module" src="assets/js/include.js"></script>
<script type="module" src="assets/js/data_siswa.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="assets/js/aos-global.js"></script>

</body>
</html>
