<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>
    Data Siswa - SMPN 20 Konawe Selatan
  </title>

  <!-- SEO -->
<meta
name="description"
content="Data siswa SMP Negeri 20 Konawe Selatan">

<meta
name="keywords"
content="Data siswa SMPN 20 Konawe Selatan, siswa SMP">

<meta
name="author"
content="SMP Negeri 20 Konawe Selatan">

  <!-- ICON -->
  <link
  rel="icon"
  href="image/Logo_transparent.png">

  <!-- FONT AWESOME -->
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet"/>
  <!-- CSS -->
  <link rel="stylesheet"
  href="assets/css/global.css">

  <link rel="stylesheet"
  href="assets/css/header-footer.css">

  <link rel="stylesheet"
  href="assets/css/datasiswa.css">

</head>

<body>

<!-- ================= HEADER ================= -->
<div id="header"></div>


<!-- ================= HERO ================= -->
<section class="hero">

  <div class="hero-content" data-aos="fade-up">

    <h1>Profil Siswa</h1>

    <p>
      Data peserta didik
      SMP Negeri 20 Konawe Selatan
    </p>

  </div>

</section>


<!-- ================= MAIN ================= -->

<div class="container">

  <!-- FILTER -->

  <div class="filter-card">

    <div class="search-box">

      <i class="fas fa-search"></i>

      <input
      type="text"
      id="searchInput"
      placeholder="Cari nama siswa...">

    </div>

    <select id="filterKelas">

      <option value="">
        Semua Kelas
      </option>

      <option value="VII">
        VII
      </option>

      <option value="VIII">
        VIII
      </option>

      <option value="IX">
        IX
      </option>

    </select>

  </div>

  <!-- STATISTIK -->

  <div class="stats-grid">

    <div class="stat-card">

      <i class="fas fa-users"></i>

      <h2 id="totalSiswaStat">
        0
      </h2>

      <p>Total Siswa</p>

    </div>

    <div class="stat-card">

      <i class="fas fa-male"></i>

      <h2 id="totalLaki">
        0
      </h2>

      <p>Laki-laki</p>

    </div>

    <div class="stat-card">

      <i class="fas fa-female"></i>

      <h2 id="totalPerempuan">
        0
      </h2>

      <p>Perempuan</p>

    </div>

  </div>

  <!-- ================= DATA SISWA ================= -->

  <div class="siswa-wrapper">

    <div class="siswa-header">

      <h1>

        <i class="fas fa-user-graduate"></i>

        Profil Peserta Didik

      </h1>

      <p>
        Data siswa SMP Negeri 20 Konawe Selatan
      </p>

    </div>

    <!-- CARD SISWA -->

    <div
    id="dataSiswa"
    class="siswa-grid">

      <div class="loading-box">

        <i class="fas fa-spinner fa-spin"></i>

        <p>
          Memuat data siswa...
        </p>

      </div>

    </div>

  </div>

</div>

<!-- ================= FOOTER ================= -->

<div id="footer"></div>

<!-- ================= SCRIPT ================= -->

<script type="module" src="assets/js/include.js"></script>
<script type="module" src="assets/js/data_siswa.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="assets/js/aos-global.js"></script>
</body>
</html>
